<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Don't let go</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root {
    --mustard: #f4c04e; --teal: #1f6b70; --avocado: #66733a;
    --bg: var(--plaster);
    --d: min(260px, 46vw, 32vh);
  }
  html, body { overflow: hidden; touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: background-color 500ms var(--ease), color 500ms var(--ease); }

  /* ---------- hud ---------- */
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: clamp(12px, 3vh, 30px) 12px 0; text-align: center; pointer-events: none; z-index: 6; }
  #title { margin: 0; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 140; text-transform: uppercase;
    font-size: clamp(34px, 8.4vw, 96px); line-height: 0.9; letter-spacing: -0.01em; }
  #tag { margin: 10px 0 0; font-size: clamp(15px, 2vw, 19px); font-weight: 600; color: var(--ink-2); }
  #bestline { margin: 6px 0 0; font-family: var(--display); font-weight: 700; font-variation-settings: "wdth" 112; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  #timerWrap { position: relative; display: none; }
  #timer { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 112; font-variant-numeric: tabular-nums;
    font-size: clamp(42px, 9vw, 88px); line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  #timer.alt { font-size: clamp(24px, 5.4vw, 52px); padding: .35em 0; }
  #timer.stretch { animation: stretch 900ms var(--ease); }
  @keyframes stretch { 0% { font-variation-settings: "wdth" 112; } 35% { font-variation-settings: "wdth" 150; } 100% { font-variation-settings: "wdth" 112; } }
  #sub { position: relative; min-height: 34px; margin-top: 6px; }
  #coach { margin: 0; font-size: clamp(15px, 1.9vw, 19px); font-weight: 600; color: var(--ink-2); opacity: 0; transition: opacity 300ms var(--ease); text-wrap: balance; }
  #coach.on { opacity: 1; }
  #mile { position: absolute; left: 50%; top: 0; transform: translateX(-50%) rotate(-2deg) scale(.4); opacity: 0; max-width: min(92vw, 560px); width: max-content;
    background: var(--mustard); border: 2px solid var(--umber); border-radius: 999px; box-shadow: 3px 3px 0 var(--umber);
    padding: 7px 16px; font-weight: 800; font-size: clamp(13.5px, 1.7vw, 16px); line-height: 1.2; color: var(--umber); text-wrap: balance;
    transition: transform 380ms cubic-bezier(.3,1.6,.5,1), opacity 200ms; }
  #mile.on { opacity: 1; transform: translateX(-50%) rotate(-2deg) scale(1); }
  #mile.on ~ #coach { opacity: 0; }
  #stage[data-state="holding"] #title, #stage[data-state="holding"] #tag, #stage[data-state="holding"] #bestline,
  #stage[data-state="over"] #title, #stage[data-state="over"] #tag, #stage[data-state="over"] #bestline { display: none; }
  #stage[data-state="holding"] #timerWrap, #stage[data-state="over"] #timerWrap { display: block; }

  /* ---------- the button ---------- */
  #rings, #rig { position: absolute; left: 50%; top: 55%; }
  #rings { width: calc(var(--d) * 2.7); height: calc(var(--d) * 2.7); transform: translate(-50%, -50%); border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle closest-side, transparent 0 46%, var(--mustard) 46.3% 56%, transparent 56.3% 66%, var(--plaster-2) 66.3% 84%, transparent 84.3%);
    transition: opacity 500ms; }
  #rig { width: var(--d); height: var(--d); z-index: 2;
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--sc, 1)); }
  #rigIn { position: absolute; inset: 0; }
  #rigIn::before { content: ""; position: absolute; inset: -7%; top: 1%; bottom: -13%; border-radius: 50%; background: var(--umber); }
  #btn { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--umber); background: var(--persimmon); color: var(--umber); padding: 0;
    box-shadow: inset 0 -12px 0 rgba(36,16,6,.13), inset 0 9px 0 rgba(255,255,255,.25), 0 16px 0 var(--brick), 0 16px 0 3px var(--umber);
    transform: translateY(-9px); transition: transform 90ms var(--ease), box-shadow 90ms var(--ease), background-color 200ms;
    cursor: pointer; touch-action: none; display: grid; place-items: center; outline-offset: 6px; }
  #stage[data-state="idle"] #btn { animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(-9px); } 50% { transform: translateY(-14px); } }
  #btn.down { transform: translateY(5px) scale(1.025, .965); background: #e85a20; animation: none !important;
    box-shadow: inset 0 7px 0 rgba(36,16,6,.18), inset 0 -4px 0 rgba(255,255,255,.12), 0 3px 0 var(--brick), 0 3px 0 3px var(--umber); }
  #btnLabel { display: block; max-width: 82%; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 104; text-transform: uppercase;
    line-height: .95; text-wrap: balance; pointer-events: none; }
  #btnLabel.big { font-variation-settings: "wdth" 135; }

  /* ---------- layers ---------- */
  #fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  #zones { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .zone { position: absolute; top: 55%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; width: min(340px, calc(50vw - var(--d) * .5 - 84px)); }
  #zA { right: calc(50% + var(--d) * .5 + 60px); align-items: flex-end; }
  #zB { left: calc(50% + var(--d) * .5 + 60px); align-items: flex-start; }
  #notes { position: absolute; top: 14px; right: 14px; width: 300px; z-index: 7; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  #mute { position: absolute; top: 12px; left: 12px; z-index: 30; min-height: 36px; padding: 0 12px; font-size: 13px; }
  #mute svg { width: 16px; height: 16px; }

  .card { pointer-events: auto; width: 100%; max-width: 340px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 12px 14px;
    animation: pop 320ms cubic-bezier(.3,1.5,.5,1) both; }
  .card.bare { background: none; border: 0; box-shadow: none; padding: 4px; }
  .card .art:empty { display: none; }
  .card .art svg { display: block; width: 78px; height: auto; }
  .card .art.wide svg { width: 118px; }
  .card .tx { min-width: 0; grid-column: 2; }
  .card .art:empty + .tx, .card.stack .tx { grid-column: 1 / -1; }
  .card h3 { margin: 0; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 118; font-size: 21px; line-height: 1.02; text-wrap: balance; }
  .card p { margin: 4px 0 0; font-size: 14.5px; font-weight: 500; line-height: 1.3; text-wrap: pretty; }
  .card .label:empty, .card h3:empty, .card p:empty, .card .btns:empty { display: none; }
  .card small { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-2); }
  .card .btns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .card .btn { min-height: 36px; font-size: 13.5px; padding: 0 12px; touch-action: none; }
  .card .btn.num { min-height: 30px; min-width: 30px; padding: 0 6px; font-size: 13px; }
  .card .kbd { font-size: 10.5px; padding: 0 4px; opacity: .75; }
  .card.bare h3 { font-size: clamp(22px, 2.6vw, 30px); font-variation-settings: "wdth" 100; font-weight: 800; }
  .card.bare h3.huge { font-size: clamp(64px, 10vw, 128px); font-variation-settings: "wdth" 140; font-weight: 900; line-height: .9; }
  .card.bare h3.swap { animation: fadein 400ms var(--ease); }
  .out { opacity: 0 !important; transition: opacity 240ms, transform 240ms; transform: scale(.94); pointer-events: none !important; }
  @keyframes pop { from { opacity: 0; transform: scale(.7) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sticker { display: inline-block; background: var(--mustard); border: 2px solid var(--umber); border-radius: 999px; padding: 2px 9px; transform: rotate(-3deg);
    font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

  /* notifications */
  .note { pointer-events: auto; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--plaster);
    border: 2px solid var(--umber); border-radius: 14px; box-shadow: 3px 3px 0 var(--umber); animation: slide 360ms cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes slide { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--teal); border: 2px solid var(--umber); color: var(--plaster); display: grid; place-items: center;
    font-family: var(--display); font-weight: 900; font-size: 17px; }
  .ava.lg { width: 64px; height: 64px; font-size: 30px; }
  .ava.ring { animation: ring 600ms ease-in-out infinite; }
  @keyframes ring { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  .note b { display: block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .note span { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.2; }
  .note .btn { min-height: 28px; padding: 0 9px; font-size: 12px; touch-action: none; }

  /* cat, bugs, eyes, crowd */
  .catwalk { position: absolute; left: 0; top: 0; width: clamp(104px, 12vw, 156px); will-change: transform; }
  .catwalk svg { display: block; width: 100%; height: auto; }
  .catwalk.flip svg { transform: scaleX(-1); }
  .catwalk .leg { transform-box: fill-box; transform-origin: 50% 0; animation: leg 420ms ease-in-out infinite alternate; }
  .catwalk .leg.b { animation-direction: alternate-reverse; }
  @keyframes leg { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  .catwalk .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: tail 1.3s ease-in-out infinite alternate; }
  @keyframes tail { from { transform: rotate(-8deg); } to { transform: rotate(14deg); } }
  .loaf { position: absolute; left: -9%; width: 118%; bottom: 14%; z-index: 3; pointer-events: none; animation: plop 520ms cubic-bezier(.3,1.5,.5,1) both; }
  .loaf svg { display: block; width: 100%; height: auto; overflow: visible; }
  .loaf.timer { left: 50%; width: clamp(124px, 14vw, 176px); margin-left: calc(clamp(124px, 14vw, 176px) / -2); bottom: auto; top: -12px; }
  #timerWrap.catted { margin-bottom: 44px; }
  @keyframes plop { from { transform: translateY(-46%) scale(.9, 1.1); opacity: 0; } 60% { transform: translateY(0) scale(1.06, .92); opacity: 1; } to { transform: none; } }
  .loaf .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .loaf .tl { transform-box: fill-box; transform-origin: 0 100%; animation: tail 1.6s ease-in-out infinite alternate; }
  .prr { position: absolute; right: -4%; top: -2%; font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(13px, 1.6vw, 18px); color: var(--umber);
    background: var(--plaster); border: 2px solid var(--umber); border-radius: 999px; padding: 1px 9px; animation: purr 240ms linear infinite alternate; }
  @keyframes purr { from { transform: translateX(-1px) rotate(7deg); } to { transform: translateX(1px) rotate(9deg); } }
  .bug { position: absolute; left: 0; top: 0; width: 46px; margin: -17px 0 0 -23px; pointer-events: auto; will-change: transform; touch-action: none; }
  .bug svg { display: block; width: 100%; height: auto; animation: skit 160ms linear infinite alternate; }
  @keyframes skit { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .bug.sm { width: 30px; margin: -11px 0 0 -15px; }
  .sign { position: absolute; left: 50%; bottom: 80%; transform: translateX(-50%); display: grid; justify-items: center; pointer-events: none; }
  .sign b { display: grid; place-items: center; min-width: 38px; height: 38px; padding: 0 6px; background: var(--plaster); border: 2px solid var(--umber); border-radius: 5px; box-shadow: 2px 2px 0 var(--umber);
    font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; animation: picket 380ms ease-in-out infinite alternate; }
  .bug.sm .sign b { min-width: 0; height: 22px; font-size: 11px; text-transform: uppercase; }
  .sign i { width: 3px; height: 16px; background: var(--umber); }
  @keyframes picket { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .eyes2 { position: absolute; display: flex; gap: 8px; animation: fadein 600ms both; }
  .eyes2 i { position: relative; width: 22px; height: 26px; border-radius: 50%; background: var(--mustard); animation: blink 3.4s infinite; }
  .eyes2 i::after { content: ""; position: absolute; left: var(--px, 8px); top: 9px; width: 7px; height: 10px; border-radius: 50%; background: #160a04; }
  .eyes2.big i { width: 40px; height: 46px; } .eyes2.big i::after { width: 12px; height: 18px; top: 16px; left: var(--px, 14px); }
  .crowd { display: flex; align-items: flex-end; gap: 4px; height: 50px; }
  .crowd i { width: 40px; height: 40px; border-radius: 50% 50% 0 0; border: 2px solid var(--umber); border-bottom: 0; position: relative; animation: peep 500ms cubic-bezier(.3,1.5,.5,1) both; }
  .crowd i::before, .crowd i::after { content: ""; position: absolute; top: 15px; width: 5px; height: 7px; border-radius: 50%; background: var(--umber); }
  .crowd i::before { left: 10px; } .crowd i::after { right: 10px; }
  @keyframes peep { from { transform: translateY(100%); } to { transform: none; } }
  .bubble { display: inline-block; background: var(--plaster); border: 2px solid var(--umber); border-radius: 14px 14px 14px 3px; box-shadow: 3px 3px 0 var(--umber); padding: 6px 12px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .minibtn { width: 74px; height: 74px; border-radius: 50%; background: var(--teal); border: 3px solid var(--umber); box-shadow: 0 8px 0 #134a4d, 0 8px 0 3px var(--umber); margin: 0 4px 12px 0;
    display: grid; place-items: center; color: var(--plaster); font-family: var(--display); font-weight: 900; font-size: 15px; animation: bob2 900ms ease-in-out infinite alternate; }
  @keyframes bob2 { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .scroll { height: 82px; overflow: hidden; margin-top: 6px; border: 2px solid var(--umber); border-radius: 6px; background: #fff3e0; padding: 0 8px; }
  .scroll ol { margin: 0; padding: 6px 0 0 18px; font-size: 12.5px; line-height: 1.3; animation: scrollup 11s linear both; }
  .scroll li { margin-bottom: 5px; }
  @keyframes scrollup { 0%, 8% { transform: translateY(0); } 100% { transform: translateY(calc(-100% + 76px)); } }
  .wob { animation: wob 1.1s ease-in-out infinite alternate; transform-origin: 50% 60%; }
  @keyframes wob { from { transform: rotate(-9deg); } to { transform: rotate(9deg) scale(1.06); } }

  /* alarm */
  .alarm { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .alarm .tint { position: absolute; inset: 0; background: var(--brick); box-shadow: inset 0 0 0 12px var(--brick); opacity: 0; animation: tint 800ms ease-in-out infinite alternate; }
  @keyframes tint { from { opacity: .03; } to { opacity: .3; } }
  .abar { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: 22px; width: min(620px, calc(100% - 24px)); display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: var(--brick); color: var(--plaster); border: 2px solid var(--umber); border-radius: 10px; box-shadow: 4px 4px 0 var(--umber); padding: 10px 14px; animation: pop 300ms both; }
  .abar b { display: block; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 140; font-size: clamp(20px, 3vw, 30px); line-height: 1; }
  .abar span { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.25; margin-top: 3px; }
  .beacon { width: 34px; height: 34px; border-radius: 50%; background: var(--mustard); border: 2px solid var(--umber); animation: beacon 800ms ease-in-out infinite alternate; }
  .beacon + div + .beacon { animation-direction: alternate-reverse; }
  @keyframes beacon { from { background: #8a5a1e; box-shadow: 0 0 0 0 rgba(244,192,78,0); } to { background: var(--mustard); box-shadow: 0 0 0 9px rgba(244,192,78,.45); } }

  /* dark */
  #stage.dark { --bg: #160a04; }
  #stage.dark #rings { opacity: .07; }
  #stage.dark #hud { color: #6d4a33; } #stage.dark #coach { color: #a17a5c; }
  #stage.dark #btn { box-shadow: inset 0 7px 0 rgba(36,16,6,.18), 0 3px 0 var(--brick), 0 3px 0 3px #000, 0 0 60px 8px rgba(242,102,42,.35); }
  .banner { position: absolute; left: 50%; top: 27%; translate: -50% -50%; rotate: -4deg; z-index: 5; white-space: nowrap; background: var(--teal); color: var(--plaster); border: 3px solid var(--umber);
    box-shadow: 5px 5px 0 var(--umber); padding: 6px 22px; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 150; font-size: clamp(30px, 6.4vw, 76px); animation: pop 380ms cubic-bezier(.3,1.6,.5,1) both; }
  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border: 1.5px solid var(--umber); animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(700deg); } }

  /* crash */
  .crash { position: absolute; inset: 0; z-index: 15; background: var(--plaster-2); display: grid; place-items: center; text-align: center; padding: 20px; pointer-events: auto; }
  .crash svg { width: 110px; height: auto; margin-bottom: 10px; }
  .crash h2 { margin: 0; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 130; font-size: clamp(30px, 6vw, 60px); line-height: .95; text-transform: uppercase; }
  .crash p { margin: 10px auto 16px; max-width: 34ch; font-size: 16px; font-weight: 500; color: var(--ink-2); }
  .crash code { display: block; margin-top: 14px; font-size: 11.5px; color: var(--ink-2); letter-spacing: .05em; }
  .crash.fresh { background: var(--plaster); }
  .crash .fakebtn { width: calc(var(--d) * .8); height: calc(var(--d) * .8); margin: 26px auto 0; border-radius: 50%; background: var(--persimmon); border: 3px solid var(--umber);
    box-shadow: inset 0 9px 0 rgba(255,255,255,.25), 0 14px 0 var(--brick), 0 14px 0 3px var(--umber); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 135; font-size: calc(var(--d) * .16); }
  .glitch { animation: glitch 500ms steps(2) both; }
  @keyframes glitch { 0% { transform: translate(0); } 25% { transform: translate(-7px, 3px) skewX(-2deg); } 50% { transform: translate(6px, -4px) skewX(3deg); } 75% { transform: translate(-3px, 5px); } 100% { transform: none; } }

  /* end */
  #end { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 14px; background: rgba(36,16,6,.62); overflow: auto; animation: fadein 300ms both; }
  #end[hidden] { display: none; }
  .endp { position: relative; width: min(470px, 100%); padding: clamp(16px, 4vw, 26px); text-align: center; box-shadow: 7px 7px 0 var(--umber); animation: pop 420ms cubic-bezier(.3,1.5,.5,1) both; user-select: text; -webkit-user-select: text; }
  #eRank { display: inline-block; background: var(--umber); color: var(--plaster); border-radius: 999px; padding: 4px 12px; }
  #eTime { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 125; font-variant-numeric: tabular-nums; font-size: clamp(40px, 11.5vw, 70px); line-height: 1; margin: 10px 0 2px; }
  [hidden] { display: none !important; }
  #eCause { margin: 0; font-size: 17px; font-weight: 600; } #eCause b { background: var(--mustard); padding: 0 6px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #eVerdict { margin: 12px auto 0; max-width: 36ch; font-size: 16.5px; line-height: 1.4; text-wrap: pretty; }
  .estats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 16px 0; padding: 10px 0; border-top: 2px solid var(--umber); border-bottom: 2px solid var(--umber); }
  .estats b { display: block; font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  .endp .row { justify-content: center; } .endp .btn { min-height: 46px; padding: 0 20px; font-size: 15.5px; }
  #newbest { position: absolute; top: -14px; right: -10px; transform: rotate(8deg); font-size: 13px; padding: 4px 12px; box-shadow: 3px 3px 0 var(--umber); }
  #eLife { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }

  @media (max-width: 899px) {
    #rings, #rig { top: 50%; }
    #zones { inset: auto 12px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .zone { display: contents; }
    #notes { top: 112px; left: 12px; right: 12px; width: auto; align-items: center; }
    .note { width: min(100%, 360px); }
    #mute { top: 8px; left: 8px; padding: 0 9px; } #mute span { display: none; }
    #stage[data-state="idle"] #hud { padding-top: 54px; }
    .abar { bottom: auto; top: 106px; }
    #stage.alarming #notes { top: 186px; }
    .card.bare { text-align: center; justify-items: center; } .card.bare .crowd { justify-content: center; }
    #timer.alt { font-size: 4.5vw; padding: .9em 0 .5em; }
    .card { max-width: 366px; padding: 10px 12px; }
    .card h3 { font-size: 19px; } .card p { font-size: 14px; }
    .card .art svg { width: 62px; } .card .art.wide svg { width: 92px; }
    .ava.lg { width: 52px; height: 52px; font-size: 24px; }
    .banner { top: 30%; }
  }
  @media (max-height: 620px) { #rings, #rig { top: 58%; } #tag { margin-top: 4px; } }

  const c = { id, def, t0: G.t, dead: false, els: [], fr: [], keys: [], clean: [], cause: def.cause, lose: def.lose };
  c.at = (dt, fn) => at(c.t0 + dt, () => { if (!c.dead && G.state === 'holding') fn(); });
  c.add = (parent, node) => { parent.appendChild(node); c.els.push(node); return node; };
  c.frame = fn => { frames.add(fn); c.fr.push(fn); return fn; };
  c.key = (k, fn) => { keymap.set(k, fn); c.keys.push(k); };
  c.end = () => { if (c.dead) return; c.dead = true; c.fr.forEach(f => frames.delete(f)); c.keys.forEach(k => keymap.delete(k)); c.clean.forEach(f => { try { f(); } catch (e) {} }); c.els.forEach(n => n.isConnected && out(n)); const i = active.indexOf(c); if (i >= 0) active.splice(i, 1); c.endedAt = G.t; lastEnded = c; };
  active.push(c); if (!stats.seen.includes(id)) stats.seen.push(id);
  try { def.run(c); } catch (e) { console.error(e); }
  at(c.t0 + def.dur, c.end);
  return c;
}

        p = c.add(stage, el(`<div class="crash"><div>${ART.page}<h2>Aw, crumbs.</h2><p>This page fell over and can’t get up. Your time was not saved.</p><div class="btns" style="display:flex;justify-content:center"></div><code>ERR_BUTTON_HELD_TOO_WELL</code></div></div>`));
        const rl = () => trap(c.id, 'a fake crash', 'You hit reload on a drawing of a crash. The page was fine. You were not.');
        p.querySelector('.btns').appendChild(mkBtn({ label: 'Reload page', key: 'r', cls: 'solid', fn: rl })); c.key('r', rl);
      });
      c.at(5, () => { keymap.delete('r'); p.classList.add('fresh'); p.innerHTML = `<div><h2 style="font-size:clamp(34px,8.4vw,96px)">Don’t let go</h2><p>Press and hold the button. That’s the whole game.</p><div class="fakebtn">HOLD</div><code style="margin-top:34px">00:00.00</code></div>`; S.pop(); });
      c.at(8.2, () => { p.remove(); G.tf = null; stage.classList.remove('glitch'); say(`Kidding. You’re at ${real} and change. Breathe.`, 3.6); S.ding(); });
    } },
  win: { dur: 10.5, cause: 'a fake victory screen', lose: 'You cannot win this game. You can only lose it later.',
    run(c) {
      confetti(c); S.fanfare(); c.add(stage, el('<div class="banner" style="background:#f4c04e;color:#241006">YOU WIN!</div>'));
      const k = card(c, zA, { art: ART.trophy, kicker: 'Game complete', title: 'That’s it! You finished.', body: 'You may now let go.', btns: [{ label: 'Collect trophy', key: 't', fn: () => trap(c.id, 'a fake victory screen', 'You went to collect the trophy. The trophy was the friends you ignored along the way.') }] });
      c.at(4, () => k.set({ body: 'Credits will roll any second.' })); c.at(7.2, () => k.set({ title: '…it’s still going, isn’t it.', body: 'Awkward. Sorry. As you were.' }).btns([]));
    } },
  parade: { dur: 12, cause: 'five bugs with picket signs', lose: 'The bugs organised and you folded. That is how change happens.',
    run(c) {
      const W = innerWidth, r = btnRect(), y = Math.min(r.bottom + 78, innerHeight - 40), letters = ['O', 'G', 'T', 'E', 'L'], gap = Math.min(64, W / 6.4), v = (W + gap * 9) / 10.6;
      const bugs = letters.map((l, i) => { const n = bugAt(c); n.style.pointerEvents = 'none'; n.appendChild(el(`<div class="sign"><b>${l}</b><i></i></div>`)); return { n, off: -(i + (i > 1 ? .7 : 0)) * gap - 30 }; });
      const sm = bugAt(c, 'sm'); sm.style.pointerEvents = 'none'; sm.appendChild(el('<div class="sign"><b>pls</b><i></i></div>')); bugs.push({ n: sm, off: -8.3 * gap, lag: 1 });
      say('He told the others.', 3.5); for (let i = 0; i < 5; i++) c.at(i * 2.2, () => S.skit());
      c.frame(() => { const t = G.t - c.t0; bugs.forEach(b => { const x = b.off + v * t + (b.lag ? Math.sin(t * 3) * 10 : 0); b.n.style.transform = `translate(${x}px,${y + (b.lag ? 6 : 0)}px)`; }); });
    } },
  finale: { dur: 19, cause: SPECIAL.finale[0], lose: SPECIAL.finale[1],
    run(c) {
      G.finaleUntil = G.t + 19; say('Right. Everything. At once.', 3.5);
      c.at(1.2, () => launch('alarm')); c.at(2.4, () => launch('cat')); c.at(4, () => launch('parade')); c.at(5.6, () => launch('momcall')); c.at(7.5, () => launch('achievement2')); c.at(9, () => note('WHAT IS THAT NOISE'));
    } },
};
const TOTAL = Object.keys(D).length;

/* ---------- timeline ---------- */
function buildPlan() {
  const acts = [['achievement', 'suggest', 'cookie', 'battery', 'bug', 'polite'], ['cat', 'car', 'countdown', 'survey', 'shrink', 'voice', 'timer'], ['alarm', 'drift', 'terms', 'dark', 'decoy', 'crowd', 'momcall'], ['crash', 'win', 'parade', 'countdown2', 'cat2', 'achievement2']].map(shuffle);
  for (let i = 0; i < 3; i++) if (rnd() < .55) { const a = acts[i], b = acts[i + 1], x = a.length - 1; [a[x], b[0]] = [b[0], a[x]]; }
  const ids = acts.flat(); const pi = ids.indexOf('parade'), bi = ids.indexOf('bug'); if (pi < bi) { ids[pi] = 'bug'; ids[bi] = 'parade'; }
  let t = 9.5; const plan = [];
  ids.forEach(id => { plan.push([t, id]); t += D[id].adv || D[id].dur + .8; });
  plan.push([t + 1, 'finale']); return { plan, end: t + 1 + D.finale.dur };
}
function schedule(from) {
  const forced = (Q.get('d') || '').split(',').filter(x => D[x]);
  const { plan, end: fin } = buildPlan(); G.finaleAt = fin - D.finale.dur;
  if (forced.length) { forced.forEach((id, i) => at(from + .3 + i * .4, () => launch(id))); }
  else {
    plan.forEach(([t, id]) => { if (t >= from) at(t, () => launch(id)); });
    [[2, 'That’s it. That’s the whole game.'], [5.2, 'Nothing is going to happen.'], [8, 'Probably.']].forEach(([t, s]) => { if (t >= from) at(t, () => say(s, 2.8)); });
    const after = [[2, '…'], [5, 'That’s everything we’ve got.'], [9, 'There is no prize. There was never a prize.'], [13.5, 'You can keep holding. We’ll just be here. Recycling material.']];
    after.forEach(([dt, s]) => { if (fin + dt >= from) at(fin + dt, () => say(s, 3.6)); });
    const pool = Object.keys(D).filter(x => x !== 'finale');
    const more = t => at(t, () => { const id = pick(pool.filter(x => !isOn(x))); launch(id); more(G.t + (D[id].dur || 10) + 2 + rnd() * 4); });
    more(Math.max(from + 4, fin + 18));
  }
  if (Q.get('mom') !== '0') {
    let t = 16, i = 0; while (t < from) { t += 19 + ((i * 7) % 9); i++; } G.momI = i;
    const tickMom = () => { if (['alarm', 'crash', 'dark', 'momcall', 'finale', 'cat2'].some(isOn)) { at(G.t + 4, tickMom); return; } note(G.momI < MOM.length ? MOM[G.momI] : pick(MOM_MORE)); G.momI++; at(G.t + 19 + rnd() * 9, tickMom); };
    at(t, tickMom);
  }
  G.mi = MILES.findIndex(m => m[0] > from); if (G.mi < 0) G.mi = MILES.length;
  if (Q.has('hold')) at(from + num('hold', 5), () => end(Q.get('why') || 'release'));
}

/* ---------- run control ---------- */
function resetScene() {
  active.slice().forEach(c => c.end()); queue = []; frames.clear(); keymap.clear(); lastEnded = null;
  [fx, zA, zB, notes].forEach(n => n.innerHTML = ''); stage.querySelectorAll('.alarm,.crash,.banner,.confetti,.loaf').forEach(n => n.remove());
  stage.classList.remove('dark', 'glitch', 'alarming'); G.tf = null; timerEl.classList.remove('alt'); timerWrap.classList.remove('catted'); coach.classList.remove('on'); mile.classList.remove('on');
  rig.style.setProperty('--dx', '0px'); rig.style.setProperty('--dy', '0px'); rig.style.setProperty('--sc', 1);
}
function start(mode, e) {
  if (G.state !== 'idle' || performance.now() < G.lockUntil) return;
  resetScene(); if (mode !== 'sim') audioInit();
  G.state = 'holding'; G.mode = mode; G.base = SIM || 0; G.t = G.base; G.startNow = clock(); G.finaleUntil = -1; G.momAt = -99;
  if (e) { G.pid = e.pointerId; G.ptype = e.pointerType || 'mouse'; G.px = e.clientX; G.py = e.clientY; } else { G.pid = null; if (mode === 'key') G.ptype = 'mouse'; }
  if (Q.get('touch') === '1') G.ptype = 'touch';
  stage.dataset.state = 'holding'; btn.classList.add('down'); setLabel(null); S.press();
  if (navigator.vibrate && mode !== 'sim') { try { navigator.vibrate(12); } catch (x) {} }
  schedule(G.base);
}
function end(reason, o) {
  if (G.state !== 'holding') return;
  G.state = 'over'; G.lockUntil = performance.now() + 700; const t = G.t;
  stage.dataset.state = 'over'; btn.classList.remove('down'); timerEl.textContent = fmt(t); timerEl.classList.remove('alt');
  let cause, verdict; const cur = active.length ? active[active.length - 1] : (lastEnded && t - lastEnded.endedAt < 1.5 ? lastEnded : null);
  if (o) { cause = o.cause; verdict = o.verdict; }
  else if (t - G.base < 1.5 && SIM == null) [cause, verdict] = SPECIAL.click;
  else if (reason === 'hidden') [cause, verdict] = SPECIAL.hidden;
  else if (reason === 'blur') [cause, verdict] = SPECIAL.blur;
  else if (t < G.finaleUntil) [cause, verdict] = SPECIAL.finale;
  else if (cur) { cause = cur.cause; verdict = cur.lose; if (reason === 'slip' && !['drift', 'shrink'].includes(cur.id)) verdict += ' (Technically you slid off the button. It still counts.)'; }
  else if (t - G.momAt < 6.5) [cause, verdict] = SPECIAL.mom;
  else if (reason === 'slip') [cause, verdict] = SPECIAL.slip;
  else [cause, verdict] = SPECIAL.none;
  const tier = t - G.base < 1.5 && SIM == null ? '' : TIERS.filter(x => t >= x[0]).pop()[1] + ' ';
  const rank = RANKS.filter(x => t >= x[0]).pop()[1];
  const isBest = t > stats.best && t >= 1.5; if (isBest) stats.best = t;
  stats.runs++; stats.total += t - G.base; save();
  S.sad(); if (navigator.vibrate && G.mode !== 'sim') { try { navigator.vibrate([30, 40, 60]); } catch (x) {} }
  G.last = { t, cause };
  $('#eRank').textContent = rank; $('#eTime').textContent = fmt(t); $('#eCause').innerHTML = 'Lost to <b></b>'; $('#eCause b').textContent = cause;
  $('#eVerdict').textContent = tier + verdict; $('#eBest').textContent = fmt(stats.best); $('#eRuns').textContent = '#' + stats.runs;
  $('#eSeen').textContent = Math.min(stats.seen.length, TOTAL) + ' / ' + TOTAL; $('#newbest').hidden = !isBest || stats.runs < 2;
  $('#eLife').textContent = `Lifetime spent holding a button: ${fmtShort(stats.total)}.`; $('#share').textContent = 'Copy brag';
  setTimeout(() => { endEl.hidden = false; if (G.mode === 'key') $('#again').focus(); }, RM || SIM != null ? 0 : 450);
  drawBest();
}
function again() { if (performance.now() < G.lockUntil) return; endEl.hidden = true; resetScene(); G.state = 'idle'; stage.dataset.state = 'idle'; timerEl.textContent = '00:00.00'; setLabel(null); btn.focus({ preventScroll: true }); }
function drawBest() { $('#bestline').textContent = stats.best ? `Your best: ${fmt(stats.best)}` : ''; }
$('#again').addEventListener('click', again);
$('#share').addEventListener('click', async () => {
  if (!G.last) return; let url = location.href.split('?')[0]; try { url = window.top.location.href.split('?')[0]; } catch (e) {}
  const text = `I held a button for ${fmtShort(G.last.t)} and lost to ${G.last.cause}. Don't let go: ${url}`; let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (x) {} }
  $('#share').textContent = ok ? 'Copied. Go brag.' : 'Couldn’t copy, sorry';
});

/* ---------- input ---------- */
btn.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return; if (G.state !== 'idle') return;
  try { btn.releasePointerCapture(e.pointerId); } catch (x) {}
  start('pointer', e);
});
btn.addEventListener('gotpointercapture', e => { try { btn.releasePointerCapture(e.pointerId); } catch (x) {} });
const mine = e => G.state === 'holding' && G.mode === 'pointer' && e.pointerId === G.pid;
addEventListener('pointermove', e => { if (!mine(e)) return; G.px = e.clientX; G.py = e.clientY; if (e.pointerType === 'mouse' && e.buttons === 0) end('release'); else if (offButton()) end('slip'); });
addEventListener('pointerup', e => { if (mine(e)) end('release'); });
addEventListener('pointercancel', e => { if (mine(e)) end('release'); });
document.documentElement.addEventListener('pointerleave', e => { if (mine(e) && e.pointerType === 'mouse') end('slip'); });
addEventListener('touchend', e => { if (G.state === 'holding' && G.mode === 'pointer' && G.ptype === 'touch' && e.touches.length === 0) end('release'); }, { passive: true });
addEventListener('blur', () => { if (G.mode !== 'sim') end('blur'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode !== 'sim') end('hidden'); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dragstart', e => e.preventDefault());
addEventListener('mousedown', e => { if (G.state === 'holding' && G.mode === 'key' && e.target !== btn) e.preventDefault(); });
btn.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return; e.preventDefault(); if (e.repeat) return;
  if (G.state === 'idle') { G.key = e.key; start('key'); }
});
btn.addEventListener('click', e => e.preventDefault());
addEventListener('keyup', e => { if (G.state === 'holding' && G.mode === 'key' && e.key === G.key) end('release'); });
btn.addEventListener('blur', () => { if (G.state === 'holding' && G.mode === 'key') end('blur'); });
addEventListener('keydown', e => {
  if (G.state !== 'holding') return; if (e.key === ' ') e.preventDefault(); if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Tab' && G.mode === 'key') { e.preventDefault(); return; }
  const fn = keymap.get(e.key.toLowerCase()); if (fn) { e.preventDefault(); fn(); }
});
addEventListener('resize', () => setLabel(G.state === 'holding' ? btnLabel.textContent : null));

/* ---------- loop ---------- */
let prevT = 0;
function offButton() { if (G.mode !== 'pointer') return false; const r = btnRect(), tol = G.ptype === 'mouse' ? 12 : 30; return Math.hypot(G.px - r.left - r.width / 2, G.py - r.top - r.height / 2) > r.width / 2 + tol; }
function loop() { requestAnimationFrame(loop); tick(); }
function tick() {
  if (G.state !== 'holding') return;
  const now = clock(); G.t = G.base + (now - G.startNow) / 1000 * SPEED; const dt = clamp(G.t - prevT, 0, .25 * SPEED); prevT = G.t;
  if (queue.length) { const due = queue.filter(q => q.t <= G.t); if (due.length) { queue = queue.filter(q => q.t > G.t); due.sort((a, b) => a.t - b.t).forEach(q => { if (G.state === 'holding') { try { q.fn(); } catch (e) { console.error(e); } } }); } }
  if (G.state !== 'holding') return;
  frames.forEach(f => { try { f(dt); } catch (e) { console.error(e); } });
  if (offButton()) { end('slip'); return; }
  timerEl.textContent = G.tf ? G.tf(G.t) : fmt(G.t);
  while (G.mi < MILES.length && G.t >= MILES[G.mi][0]) { milestone(MILES[G.mi][1]); G.mi++; }
}
setLabel(null); drawBest(); if (SIM != null) setInterval(tick, 16); else { requestAnimationFrame(loop); setInterval(tick, 60); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setLabel(G.state === 'holding' ? btnLabel.textContent : null));
if (SIM != null) { G.lockUntil = 0; start('sim'); prevT = G.t; const ff = num('ff', 0); if (ff > 0) { FF = true; for (let i = 0; i < ff * 62.5 / SPEED && G.state === 'holding'; i++) { clockOff += 16; tick(); } FF = false; } }
})();
</script>
</body>
