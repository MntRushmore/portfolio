<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say the Room</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root {
    --mustard: #f4c04e; --teal: #1f6b70; --avocado: #7a8743; --plum: #7b2d5b; --cream: #fbe6cc; --wood: #9a5a2a;
    --spring: cubic-bezier(.3, 1.5, .5, 1);
    --beat: 0.6s;
  }
  html, body { overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; background: #f3d2ab; }

  #room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
  .k { stroke: var(--umber); stroke-width: 2.25px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .kt { stroke: var(--umber); stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linecap: round; fill: none; }

  /* Things are placed by .pos (set from the layout table) and popped by .pop. */
  .pos { transition: transform 520ms var(--spring); }
  .pop { transform-origin: 0 0; transform: scale(0.3, 0); opacity: 0; transition: transform 200ms cubic-bezier(.5, 0, .9, .4), opacity 160ms linear 40ms; }
  .obj.on > .pop { transform: none; opacity: 1; animation: popIn 560ms var(--spring) both; }
  @keyframes popIn { 0% { transform: scale(.3, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  .drop > .pop { transform: translateY(-520px); }
  .drop.on > .pop { animation: dropIn 760ms cubic-bezier(.3, 1.3, .5, 1) both; }
  @keyframes dropIn { 0% { transform: translateY(-520px); opacity: 1; } 100% { transform: none; opacity: 1; } }

  .fade { opacity: 0; transition: opacity 500ms var(--ease); }
  .fade.on { opacity: 1; }

  /* Wall graphics draw themselves along their paths. */
  .gfx .dash { stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset 260ms ease-in; fill: none; }
  .gfx.on .dash { stroke-dashoffset: 0; transition: stroke-dashoffset 900ms cubic-bezier(.3, .7, .2, 1) var(--d, 0ms); }
  .gfx .grow { transform: scale(0); transition: transform 240ms ease-in; }
  .gfx.on .grow { transform: none; transition: transform 700ms var(--spring) var(--d, 0ms); }
  #wallWipe { transform-origin: 0 300px; transform: scale(0); }
  #wallWipe.go { transform: scale(420); transition: transform 620ms cubic-bezier(.4, 0, .3, 1); }

  /* Always-on life. */
  .leaf { transform-origin: 0 0; transform: scale(0); transition: transform 200ms ease-in; }
  .on .leaf { transform: none; transition: transform 620ms var(--spring) var(--d, 0ms); }
  .sway { transform-origin: 0 0; animation: sway 5.5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  .tail { transform-origin: 24px -8px; animation: tail 2.8s ease-in-out infinite alternate; }
  @keyframes tail { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  .wag { transform-origin: 82px -52px; animation: wag calc(var(--beat) * .5) ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-16deg); } to { transform: rotate(18deg); } }
  .flame { transform-origin: 0 0; animation: flame 420ms ease-in-out infinite alternate; }
  .flame.b { animation-duration: 530ms; animation-delay: -200ms; }
  .flame.c { animation-duration: 350ms; animation-delay: -90ms; }
  @keyframes flame { from { transform: scale(.86, .78) skewX(-5deg); } to { transform: scale(1.06, 1.14) skewX(5deg); } }
  .flick { animation: flick 1.3s steps(7) infinite; }
  @keyframes flick { 0% { opacity: .78; } 25% { opacity: 1; } 45% { opacity: .7; } 70% { opacity: .95; } 100% { opacity: .82; } }
  .blob { animation: blob 7s ease-in-out infinite alternate; }
  .blob.b { animation-duration: 9s; animation-delay: -4s; }
  .blob.c { animation-duration: 5.5s; animation-delay: -2s; }
  @keyframes blob { from { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-52px) scale(.8, 1.3); } to { transform: translateY(-104px) scale(1.05, .9); } }
  .rain { animation: rain 520ms linear infinite; }
  @keyframes rain { to { transform: translate(-40px, 120px); } }
  .snow { animation: snow 3.4s linear infinite; }
  @keyframes snow { to { transform: translate(0, 120px); } }
  .cloud { animation: cloud 46s linear infinite; }
  .cloud.b { animation-duration: 70s; animation-delay: -30s; }
  @keyframes cloud { from { transform: translateX(-260px); } to { transform: translateX(260px); } }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
  .twinkle:nth-child(odd) { animation-delay: -1.3s; animation-duration: 3.1s; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
  .tvbars { animation: tvbars 3s steps(1) infinite; }
  @keyframes tvbars { 0%, 100% { transform: none; } 47% { transform: translateY(3px) skewX(-2deg); } 50% { transform: none; } 81% { transform: translateX(-2px); } 83% { transform: none; } }
  .zz { opacity: 0; }
  .asleep .zz { animation: zz 3.2s ease-in infinite; }
  .asleep .zz.b { animation-delay: 1.1s; }
  .asleep .zz.c { animation-delay: 2.1s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -62px) scale(1.25); } }
  .eyes-shut { display: none; }
  .asleep .eyes-shut { display: inline; }
  .asleep .eyes-open { display: none; }
  .blink .eyes-open { transform: scaleY(.1); }
  .eyes-open { transform-origin: 0 -2px; transition: transform 70ms linear; }
  .ear { transition: transform 160ms var(--spring); transform-origin: 0 -12px; }
  .perk .ear.l { transform: rotate(-12deg) scaleY(1.14); }
  .perk .ear.r { transform: rotate(12deg) scaleY(1.14); }
  .pupil { transition: transform 180ms var(--ease); }

  /* Music: the record turns, notes drift up and the room bops on the beat. */
  .spin { transform-origin: 0 0; }
  .music .spin { animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .arm { transform-origin: 44px -152px; transform: rotate(-24deg); transition: transform 600ms var(--ease); }
  .music .arm { transform: none; }
  .note { opacity: 0; }
  .music .note { animation: note calc(var(--beat) * 4) ease-out infinite; }
  .music .note.b { animation-delay: calc(var(--beat) * -1.3); }
  .music .note.c { animation-delay: calc(var(--beat) * -2.6); }
  .music .note.d { animation-delay: calc(var(--beat) * -3.4); display: none; }
  .music.g1 .note.d, .music.g2 .note.d { display: inline; }
  @keyframes note { 0% { opacity: 0; transform: translate(0, 0) rotate(-8deg) scale(.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--nx, 40px), -190px) rotate(14deg) scale(1.15); } }
  .bop { transform-origin: 0 0; }
  .music.g1 .bop, .music.g2 .bop { animation: bop var(--beat) cubic-bezier(.3, 0, .4, 1) infinite; }
  @keyframes bop { 0%, 100% { transform: scale(1, 1); } 18% { transform: scale(1.025, .955); } 55% { transform: scale(.99, 1.02); } }
  .music.g2 .bop { animation-name: bop2; }
  @keyframes bop2 { 0%, 100% { transform: scale(1, 1) translateY(0); } 18% { transform: scale(1.05, .92); } 55% { transform: scale(.97, 1.05) translateY(-9px); } }
  .ballspin { animation: ballspin calc(var(--beat) * 6) linear infinite; }
  @keyframes ballspin { to { transform: translateX(-52px); } }
  .spots { opacity: 0; transition: opacity 600ms; }
  .spots.on { opacity: 1; }
  .spots .row { animation: spots calc(var(--beat) * 14) linear infinite; }
  .spots .row.b { animation-direction: reverse; animation-duration: calc(var(--beat) * 19); }
  @keyframes spots { to { transform: translateX(400px); } }
  .spots ellipse { fill: #fff6dc; opacity: .34; }
  .party .spots ellipse:nth-child(3n) { fill: #ffd34f; }
  .party .spots ellipse:nth-child(3n+1) { fill: #ff8a52; }
  .party .spots ellipse:nth-child(3n+2) { fill: #7fe0d6; }
  .flag { transform-origin: var(--fx) var(--fy); transform: scale(0); transition: transform 180ms ease-in; }
  .party .flag { transform: none; transition: transform 500ms var(--spring) var(--d, 0ms); }
  .bstring { opacity: 0; transition: opacity 300ms; }
  .party .bstring { opacity: 1; }
  .confetti { display: none; }
  .party .confetti { display: inline; }
  .confetti rect { animation: confetti 4s linear infinite; }
  @keyframes confetti { from { transform: translateY(-140px) rotate(0deg); } to { transform: translateY(1250px) rotate(540deg); } }

  #shade { transition: opacity 900ms var(--ease); pointer-events: none; }
  .hole, .glow { opacity: 0; transition: opacity 800ms var(--ease); }
  .beam { transform-origin: 0 0; transition: transform 1200ms var(--ease), opacity 800ms var(--ease); }
  .beam path, .daylight, .wxgrey { transition: fill 800ms, opacity 800ms var(--ease); }
  .sky, .sun, .moon, .stars, .wx, #tint, .floor { transition: opacity 800ms var(--ease), transform 1100ms var(--ease), fill 800ms; }

  /* ---- Interface ---- */
  .top { position: absolute; z-index: 3; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 16px; pointer-events: none; }
  .brand, .meter { pointer-events: auto; padding: 9px 13px 10px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 135; font-size: 22px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
  .brand p { margin: 5px 0 0; font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1.25; max-width: 30ch; }
  .meter { min-width: 148px; text-align: right; }
  .meter .big { display: flex; justify-content: flex-end; align-items: baseline; gap: 4px; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 120; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .meter .big small { font-size: 13px; font-weight: 800; }
  .meter .sub { margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spark { display: flex; justify-content: flex-end; align-items: flex-end; gap: 2px; height: 14px; margin-top: 5px; }
  .spark i { width: 4px; background: var(--persimmon); border-radius: 1px; min-height: 2px; }
  .meter.tick .big { animation: tick 260ms var(--ease); }
  @keyframes tick { 0% { color: var(--persimmon); transform: scale(1.06); transform-origin: right bottom; } 100% { color: inherit; transform: none; } }

  .grain { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .5; mix-blend-mode: multiply; }
  #fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; padding: 3px 9px 4px; border: 2px solid var(--umber); border-radius: 999px; background: var(--mustard); color: var(--umber); font-weight: 800; font-size: 13px; line-height: 1.2; white-space: nowrap; box-shadow: 2px 2px 0 var(--umber); animation: tag 1500ms var(--ease) both; }
  .tag small { display: inline-block; margin-left: 6px; font-weight: 700; font-size: 11px; opacity: .72; font-variant-numeric: tabular-nums; }
  .tag.minus { background: var(--umber); color: var(--plaster); text-decoration: line-through; box-shadow: none; }
  .tag.set { background: var(--plaster); }
  @keyframes tag { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -112%) scale(1.1); } 22% { transform: translate(-50%, -100%) scale(1); } 76% { opacity: 1; transform: translate(-50%, -118%); } 100% { opacity: 0; transform: translate(-50%, -160%); } }
  .bit { position: absolute; width: 10px; height: 10px; margin: -5px; border: 2px solid var(--umber); background: var(--c); animation: bit 640ms cubic-bezier(.1, .7, .3, 1) both; }
  .bit.r { border-radius: 50%; }
  @keyframes bit { from { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; } 70% { opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(220deg) scale(.3); opacity: 0; } }
  .puff { position: absolute; width: 30px; height: 30px; margin: -15px; border-radius: 50%; background: #fff3df; border: 2px solid var(--umber); animation: puff 520ms ease-out both; }
  @keyframes puff { from { transform: translate(0, 0) scale(.4); opacity: .95; } to { transform: translate(var(--dx), var(--dy)) scale(1.7); opacity: 0; } }

  .dock { position: absolute; z-index: 3; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(920px, calc(100% - 28px)); display: flex; align-items: center; gap: 14px; }
  .sheet { flex: 1 1 auto; min-width: 0; padding: 9px 11px 10px; display: grid; gap: 7px; }
  .toprow, .foot { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .hears { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 28px; align-items: center; }
  .hears::-webkit-scrollbar, .tries::-webkit-scrollbar { display: none; }
  .hears .label, .tries .label { flex: none; margin-right: 2px; }
  .hears .none { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 2px solid var(--umber); border-radius: 999px; background: #fff7ea; font-size: 12.5px; font-weight: 800; white-space: nowrap; animation: chipIn 320ms var(--spring) both; }
  .chip b { font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 11px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--umber); }
  .chip.out { animation: chipOut 380ms ease-in both; text-decoration: line-through; background: var(--plaster-2); }
  @keyframes chipIn { from { transform: scale(.4); opacity: 0; } }
  @keyframes chipOut { 60% { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.6); } }
  .icon { flex: none; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; border: 2px solid var(--umber); border-radius: 50%; background: var(--plaster); cursor: pointer; }
  .icon:hover { background: var(--plaster-2); }
  .icon svg { width: 16px; height: 16px; }
  .icon[aria-pressed="false"] .on, .icon[aria-pressed="true"] .off { display: none; }
  .sm { flex: none; min-height: 30px; padding: 0 11px; font-size: 12.5px; }

  .mic { flex: none; position: relative; width: 98px; height: 98px; border-radius: 50%; border: 2.5px solid var(--umber); background: var(--persimmon); color: var(--umber); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer;
    font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 120; font-size: 13px; line-height: 1; letter-spacing: .04em; text-transform: uppercase; box-shadow: 4px 5px 0 var(--umber); transition: transform 120ms var(--ease), box-shadow 120ms var(--ease), background-color 140ms; }
  .mic:hover { background: #ff7a42; }
  .mic:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--umber); }
  .mic svg { width: 38px; height: 38px; }
  .mic[aria-pressed="true"] { background: var(--brick); color: var(--plaster); }
  .mic.invite::before, .mic[aria-pressed="true"]::before { content: ""; position: absolute; inset: -4px; border: 3px solid var(--persimmon); border-radius: 50%; animation: ring 1.7s ease-out infinite; pointer-events: none; }
  .mic[aria-pressed="true"]::before { border-color: var(--brick); animation-duration: 1s; }
  @keyframes ring { from { opacity: .95; transform: scale(1); } to { opacity: 0; transform: scale(1.32); } }
  .bubble { position: absolute; left: 0; bottom: calc(100% + 16px); margin: 0; max-width: min(300px, 80vw); padding: 9px 13px 10px; border-radius: 14px; background: var(--umber); color: var(--plaster); font-size: 14px; font-weight: 700; line-height: 1.25; box-shadow: 3px 3px 0 rgba(36, 16, 6, .28); animation: chipIn 360ms var(--spring) both; }
  .bubble b { color: var(--mustard); font-weight: 800; }
  .bubble::after { content: ""; position: absolute; left: 38px; top: 100%; border: 9px solid transparent; border-top-color: var(--umber); border-bottom: 0; }
  .bubble[hidden] { display: none; }
  #say { width: 100%; min-width: 0; height: 60px; resize: none; padding: 7px 11px; border: 2px solid var(--umber); border-radius: 12px; background: #fff7ea; font-family: var(--sans); font-size: 18px; font-weight: 700; line-height: 1.25; color: var(--umber); display: block; }
  #say::placeholder { color: #a5825f; font-weight: 600; }
  #say:focus-visible { outline-offset: 0; box-shadow: none; }
  #say.demo { color: var(--ink-2); font-style: italic; }
  .tries { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; align-items: center; }
  .tries .btn { flex: none; min-height: 30px; font-size: 13px; padding: 0 11px; }
  .tries .btn[aria-pressed="true"] { background: var(--mustard); color: var(--umber); }
  .status { position: absolute; right: 0; bottom: calc(100% + 10px); max-width: min(360px, 70vw); margin: 0; padding: 6px 11px; border: 2px solid var(--umber); border-radius: 999px; background: var(--plaster); font-size: 12.5px; font-weight: 700; color: var(--brick); line-height: 1.2; }
  .status:empty { display: none; }

  @media (max-width: 640px) {
    .top { padding: 10px; }
    .brand { padding: 7px 10px 8px; }
    .brand h1 { font-size: 16px; }
    .brand p { display: none; }
    .meter { min-width: 0; padding: 6px 10px 7px; }
    .meter .big { font-size: 20px; }
    .meter .label { font-size: 9.5px; }
    .meter .sub { font-size: 11px; }
    .spark { display: none; }
    .dock { bottom: max(8px, env(safe-area-inset-bottom)); width: calc(100% - 16px); gap: 8px; }
    .sheet { padding: 7px 8px 8px; gap: 6px; box-shadow: 3px 3px 0 var(--umber); }
    .mic { width: 68px; height: 68px; font-size: 10.5px; box-shadow: 3px 4px 0 var(--umber); }
    .mic svg { width: 27px; height: 27px; }
    #say { font-size: 16px; height: 54px; padding: 6px 9px; }
    .hears .label { display: none; }
    .wide-only { display: none; }
    .sm { padding: 0 9px; }
    .tag { font-size: 11.5px; padding: 2px 7px 3px; }
    .bubble { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #room *, .chip, .mic::before, .bubble, .meter.tick .big { animation: none !important; }
    .pos, .pop { transition-duration: 0.01ms !important; }
    .note, .bit, .puff { display: none !important; }
    .tag { animation: tagCalm 1400ms linear both; transform: translate(-50%, -100%); }
    @keyframes tagCalm { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
<svg id="room" role="img" aria-label="A 1970s living room that changes as you describe it" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d0"/><stop offset="1" stop-color="#e3f3e2"/></linearGradient>
    <linearGradient id="skyMorning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd2d6"/><stop offset=".55" stop-color="#fbd9a6"/><stop offset="1" stop-color="#f7a977"/></linearGradient>
    <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b2d5b"/><stop offset=".45" stop-color="#d8442a"/><stop offset=".8" stop-color="#f4903a"/><stop offset="1" stop-color="#f4c04e"/></linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a3e"/><stop offset="1" stop-color="#3a3470"/></linearGradient>
    <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset=".42" stop-color="#000" stop-opacity=".82"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".62"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></linearGradient>
    <radialGradient id="gWarm"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".5"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gDay"><stop offset="0" stop-color="#fff8e0" stop-opacity=".55"/><stop offset=".5" stop-color="#fff8e0" stop-opacity=".2"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="0" cy="420" r="1500"><stop offset=".42" stop-color="#241006" stop-opacity="0"/><stop offset="1" stop-color="#241006" stop-opacity=".42"/></radialGradient>
    <linearGradient id="backShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241006" stop-opacity=".3"/><stop offset="1" stop-color="#241006" stop-opacity="0"/></linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241006" stop-opacity="0"/><stop offset="1" stop-color="#241006" stop-opacity=".2"/></linearGradient>
    <radialGradient id="gFire"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gLava"><stop offset="0" stop-color="#ff6aa8" stop-opacity=".55"/><stop offset="1" stop-color="#ff6aa8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gTv"><stop offset="0" stop-color="#9fe6ea" stop-opacity=".5"/><stop offset="1" stop-color="#9fe6ea" stop-opacity="0"/></radialGradient>
    <clipPath id="winClip"><rect x="-138" y="-153" width="276" height="306"/></clipPath>
    <clipPath id="tvClip"><rect x="-80" y="-176" width="120" height="112" rx="20"/></clipPath>
    <clipPath id="ballClip"><circle cx="0" cy="160" r="52"/></clipPath>
    <clipPath id="lavaClip"><path d="M -17 -4 L 17 -4 L 11 -120 L -11 -120 Z"/></clipPath>
    <mask id="lightMask" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="8000" height="8000">
      <rect x="-4000" y="-4000" width="8000" height="8000" fill="#fff"/>
      <g id="holes"></g>
    </mask>
  </defs>
  <g id="wallG"></g>
  <g id="gfxG"></g>
  <g id="floorG"></g>

let rs = 7;
const rnd = () => { rs |= 0; rs = rs + 0x6D2B79F5 | 0; let t = Math.imul(rs ^ rs >>> 15, 1 | rs); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const el = (html) => { const g = document.createElementNS(NS, 'g'); g.innerHTML = html; return g; };

/* ---------- the wall, its graphics and the floor ---------- */
$('#wallG').innerHTML = `<rect id="wall" x="-4000" y="-4000" width="8000" height="8000" fill="${BARE}"/><circle id="wallWipe" cx="0" cy="300" r="10" fill="${BARE}"/>`;

const wave = (y0) => { let d = `M -2600 ${y0}`; for (let x = -2600; x < 2600; x += 160) d += ` q 40 -64 80 0 t 80 0`; return d; };
const rays = () => { let d = ''; for (let i = 0; i < 9; i++) { const a = (-170 + i * 20) * Math.PI / 180, w = 5.2 * Math.PI / 180; const p = (r, t) => `${(300 + r * Math.cos(t)).toFixed(1)} ${(600 + r * Math.sin(t)).toFixed(1)}`; d += `<path d="M ${p(200, a - w)} L ${p(1900, a - w)} L ${p(1900, a + w)} L ${p(200, a + w)} Z" fill="var(--g${i % 2 ? 3 : 2})"/>`; } return d; };
const arc = (r, i) => `<path class="dash" pathLength="1" style="--d:${i * 90}ms" d="M ${-250 - r} 600 A ${r} ${r} 0 0 1 ${-250 + r} 600" stroke="var(--g${i + 1})" stroke-width="56"/>`;

  let specks = '';

  out += `<g class="floor" data-f="cork">${big('#c99a63')}<path d="${specks}" stroke="#7a4a25" stroke-width="3" stroke-linecap="round" opacity=".5" fill="none"/></g>`;

  out += `<rect x="-4000" y="-18" width="8000" height="18" fill="#fbe6cc" class="k"/>`;
  return out;

let text = '', epoch = 0, seq = 0, shown = 0, flights = [], lastSend = -1e9, dirtySince = null, pumpTimer = 0, backoffUntil = 0, fails = 0, lastSource = 'type';
let note = '', baseNote = '', cut = 0; // when the talk gets long: a summary of the room so far, plus the recent words
let tokens = 12, refillAt = performance.now(); const RATE = 8, CAP = 12; // stays inside the server's 100 per 10 s
const lats = [];

const NOTE_NAMES = { chair: 'a chair', lamp: 'a floor lamp', plant: 'a plant', records: 'a record player', lava: 'a lava lamp', disco: 'a disco ball', cat: 'a cat', dog: 'a dog', rug: 'a rug', art: 'a framed picture', tv: 'a TV', fire: 'a fireplace', music: 'music playing' };
function roomNote() {

}
function payload() {
  if (text.length < cut) { cut = 0; note = baseNote; }

}
function setText(t, source) {

  perk(); pump();
}
function clearRoom() {

  const prev = S; S = fresh(); prob = {}; quietFx = true; render(prev); flushFx(); quietFx = false;
}
function pump() {

async function send(warm) {

function latency(ms, jev) {

  $('#latSub').textContent = `Jev decided in ${jev} ms`;
  const mx = Math.max(300, ...lats);
  $('#spark').innerHTML = lats.map((v) => `<i style="height:${Math.max(2, Math.round(v / mx * 14))}px"></i>`).join('');

}

/* ---------- typing ---------- */
let demo = false; // the room plays one sentence by itself first; anything the visitor does takes over
const DEMO = "Teal walls, a big rainbow, a sofa, a plant and a cat. Actually, no plant. Make it night and put a lamp on.";
const bubbleEl = $('#bubble');
function bubble(html) { if (bubbleEl._h === html) return; bubbleEl._h = html; bubbleEl.innerHTML = html; bubbleEl.hidden = !html; }
const YOUR_TURN = () => (SR ? '<b>Your turn.</b> Press Talk and describe a room. Change your mind out loud.' : '<b>Your turn.</b> Type a room below. Change your mind mid-sentence.');
function startDemo() { demo = true; say.classList.add('demo'); bubble('Watch: I’ll say one first.'); typeOut(DEMO, null, 1.1, () => bubble(YOUR_TURN())); }
function endDemo(clear) { if (!demo) return; demo = false; say.classList.remove('demo'); bubble(''); if (clear) { stopScript(); show(''); setText('', 'type'); clearRoom(); } }
say.addEventListener('pointerdown', () => endDemo(true));
say.addEventListener('focus', () => endDemo(true));
say.addEventListener('input', () => { track('typed', {}, { once: true }); stopScript(); audio(); base = say.value; skip = resultCount; setText(say.value, 'type'); });
say.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); say.blur(); } });

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic'); let rec = null, listening = false, base = '', skip = 0, resultCount = 0, restarts = [], heardAny = false, lastErr = '';
// Browsers like Arc, Brave and Opera ship the speech API without the speech service behind it.
const NO_SPEECH_MSG = 'This browser can’t do speech (Arc, Brave and Opera can’t). Use Chrome, Edge or Safari, or just type.';
const join = (a, b) => (a && b ? a.replace(/\s+$/, '') + ' ' + b : a || b).replace(/\s+/g, ' ');

    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { track('mic_blocked', {}, { once: true }); listening = false; micUi(); status('The mic is blocked. Allow it in the address bar, or just type.'); say.focus(); }

mic.addEventListener('click', () => {
  audio(); endDemo(true); stopScript(); mic.classList.remove('invite');
  if (!SR) { status('This browser has no speech recognition. Type instead, it works the same.'); say.focus(); return; }
  if (listening) { listening = false; micUi(); try { rec.stop(); } catch {} status(''); return; }
  listening = true; base = text; restarts = []; heardAny = false; lastErr = ''; micUi(); track('mic_start', {}, { every: 5000 });
  try { startRec(); } catch { listening = false; micUi(); status('Could not start the mic. You can type instead.'); }
});
if (!SR) { $('#micLabel').textContent = 'Type'; say.placeholder = 'Type a room: teal walls, a big orange sofa, a cat…'; }
document.addEventListener('visibilitychange', () => { if (document.hidden && listening) { listening = false; micUi(); try { rec.stop(); } catch {} } });

/* ---------- prompts that type themselves, as if spoken ---------- */
const SCRIPTS = [
  ['Cosy night', "It's a rainy night. Teal walls, a wood floor and a big mustard sofa. Put a lamp on, a cat on the sofa, and a record playing something mellow."],
  ['House party', "Orange walls with a huge rainbow. Checkerboard floor, a disco ball, a lava lamp and a dog. Now turn the music up, it's a full party!"],
  ['Change my mind', "Plum walls with a sunburst, a sofa, a big plant and a TV. Actually, no TV. And make the walls green. No wait, lose the plant too, and add a fireplace."],
];
let scriptTimer = 0, scriptBtn = null;
function stopScript() { clearTimeout(scriptTimer); scriptTimer = 0; scriptBtn?.setAttribute('aria-pressed', 'false'); scriptBtn = null; }
function typeOut(str, btn, speed = 1, done) {
  stopScript(); if (listening) mic.click();
  show(''); setText('', 'type'); clearRoom(); scriptBtn = btn; btn?.setAttribute('aria-pressed', 'true');
  let i = 0;
  const step = () => {
    if (i >= str.length) { stopScript(); done?.(); return; }
    i++; const ch = str[i - 1]; show(str.slice(0, i)); setText(str.slice(0, i), 'type');
    scriptTimer = setTimeout(step, (/[.!?]/.test(ch) ? 620 : ch === ',' ? 300 : ch === ' ' ? 70 : 42) * speed);
  };
  scriptTimer = setTimeout(step, 250);
}
SCRIPTS.forEach(([name, s]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = name; b.addEventListener('click', () => { audio(); endDemo(false); if (scriptBtn === b) { stopScript(); return; } track('prompt_used', { prompt: name }, { every: 3000 }); typeOut(s, b); }); $('#tries').appendChild(b); });

$('#reset').addEventListener('click', () => { track('start_over', {}, { every: 3000 }); endDemo(false); stopScript(); base = ''; skip = resultCount; show(''); setText('', 'type'); clearRoom(); status(''); bubble(''); if (!listening && matchMedia('(pointer:fine)').matches) say.focus(); });
$('#snd').addEventListener('click', (e) => {
  A.on = !A.on; e.currentTarget.setAttribute('aria-pressed', A.on);
  if (A.on) { audio(); A.master.gain.setTargetAtTime(.7, A.ctx.currentTime, .05); music.on = false; music.set(S.music, S.groove); ambience(S.weather === 'rain'); } else if (A.ctx) A.master.gain.setTargetAtTime(0, A.ctx.currentTime, .05);
});
if (!A.on) $('#snd').setAttribute('aria-pressed', 'false');

/* ---------- keep it: a poster of the room, or a link that rebuilds it ---------- */
const host = (() => { try { void parent.location.href; return parent; } catch { return window; } })();
async function poster() {
  const wide = layName === 'wide', vb = wide ? [-840, -90, 1680, 1050] : [-440, -70, 880, 1120];
  const W = wide ? 1600 : 1200, H = Math.round(W * vb[3] / vb[2]), band = wide ? 170 : 210, k = (W / vb[2]) / pxPerUnit;
  const clone = svg.cloneNode(true), src = svg.querySelectorAll('*'), dst = clone.querySelectorAll('*'), drop = [];

  const pad = 48; g.textBaseline = 'alphabetic';
  try { g.fontStretch = 'extra-expanded'; } catch {}
  g.font = '900 54px Anybody, "Arial Black", sans-serif'; g.fillText('SAY THE ROOM', pad, H + 78);
  const titleW = g.measureText('SAY THE ROOM').width;
  try { g.fontStretch = 'normal'; } catch {}
  g.font = '700 22px "Hanken Grotesk", sans-serif'; g.fillStyle = '#5a3a26'; g.fillText('A room, said out loud · ' + host.location.host.replace(/:\d+$/, ''), pad, H + 116);

  const said = (demo ? '' : text.trim()) || roomNote().replace(/^\[Room so far: |\.\] $/g, '').replace(/; /g, ', ');
  if (said) {
    const x0 = wide ? pad + titleW + 70 : pad, y0 = wide ? H + 58 : H + 152, maxW = W - x0 - pad, lines = wide ? 3 : 2;
    g.font = '700 26px "Hanken Grotesk", sans-serif'; g.fillStyle = '#241006';
    const words = ('“' + said + '”').split(/\s+/), out = []; let line = '';

}
$('#save').addEventListener('click', async () => {
  const b = $('#save'); if (b.disabled) return; b.disabled = true; track('save_png', {}, { every: 3000 });
  try {
    const cv = await poster(), blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    const file = new File([blob], 'my-room.png', { type: 'image/png' });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Say the Room' }); } catch {} }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-room.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); status('Saved a poster of your room.', 2600); }
  } catch { status('Could not make the picture in this browser.', 3500); }
  b.disabled = false;
});
$('#link').addEventListener('click', async () => {
  const url = host.location.origin + host.location.pathname + '#r=' + encode(); track('copy_link', {}, { every: 3000 });
  try { await navigator.clipboard.writeText(url); status('Link copied. It opens this exact room.', 2800); }
  catch { try { host.history.replaceState(null, '', '#r=' + encode()); status('The link is in the address bar now.', 3500); } catch { status(url); } }
});

// Browsers only allow sound after a gesture, so music that was asked for by voice starts on the first one.
addEventListener('pointerdown', () => { if (A.on) { audio(); if (S.music && !music.on) music.set(true, S.groove); } }, { passive: true });

/* ---------- go ---------- */
window.__lab = { get state() { return S; }, get text() { return text; }, set: (t) => { endDemo(false); stopScript(); show(t); setText(t, 'type'); }, type: (t, speed) => typeOut(t, null, speed), feed: (t) => { endDemo(false); show(t); setText(t, 'speech'); }, get busy() { return flights.length > 0 || dirtySince != null || !!scriptTimer; }, lats, poster: async () => (await poster()).toDataURL('image/jpeg', .9), encode, get payload() { return payload(); } };
// a little paper grain over the whole picture
(() => { const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d'), d = g.createImageData(180, 180); for (let i = 0; i < d.data.length; i += 4) { const v = 150 + Math.random() * 105; d.data[i] = v; d.data[i + 1] = v * .96; d.data[i + 2] = v * .9; d.data[i + 3] = 46; } g.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; })();
render(null); fit();
addEventListener('resize', fit);
new ResizeObserver(fit).observe($('#dock'));
document.fonts?.ready.then(fit);
send(true);
const shared = /[#&]r=([0-9a-z-]+)/.exec((() => { try { return host.location.hash; } catch { return ''; } })() || location.hash);
const sharedRoom = shared && decode(shared[1]);
if (sharedRoom) {
  const prev = S; S = sharedRoom; quietFx = true; render(prev); fxQ = []; quietFx = false; baseNote = note = roomNote();
  bubble('A room someone said out loud. <b>Keep talking</b> to change it.'); track('opened_shared', {}, { once: true });
} else if (params.has('say')) setTimeout(() => typeOut(params.get('say'), null, Number(params.get('speed')) || 1), 700);
else if (params.has('t')) setTimeout(() => window.__lab.set(params.get('t')), 300);
else if (reduce || params.has('nodemo')) bubble(SR ? 'Press <b>Talk</b> and say a room into being.' : '<b>Type</b> a room into being below.');
else setTimeout(() => { if (!text && !listening && document.activeElement !== say) startDemo(); }, 900);
})();
