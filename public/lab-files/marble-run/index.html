<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble run</title>
<link rel="stylesheet" href="../kit.css">
<script src="../track.js" defer></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  body { overflow: hidden; background: #fdf2e3; touch-action: manipulation; }
  body.quiet { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { background: #e2d5bf; }
  [hidden] { display: none !important; }

  .grid2 { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; }
  .grid2 output { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 5ch; text-align: right; }
  .now { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 130; font-size: 22px; line-height: 1.05; letter-spacing: -0.02em; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* The one control that stays: play, the tune's name, and a way back to the rest. */
  .pill {
    position: fixed; left: 16px; bottom: 16px; z-index: 4; display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 999px; box-shadow: 3px 3px 0 var(--umber);
    transition: opacity 320ms var(--ease), translate 320ms var(--ease);
  }
  .pill .txt { min-width: 0; padding: 0 2px; }
  .pill .label { display: block; font-size: 9.5px; line-height: 1.2; }
  .pill .now { font-size: 16px; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill .btn { min-height: 38px; }
  #toggle { min-width: 68px; }
  body.quiet .pill { opacity: 0; translate: 0 8px; pointer-events: none; }

  /* The full controls: a slim rail beside the run on wide screens, a short sheet on small ones. */
  .sheet {
    position: fixed; z-index: 4; left: 16px; top: 58px; width: 292px; max-height: calc(100% - 58px - 88px);
    overflow: auto; display: grid; gap: 12px; align-content: start;
  }
  .tunes { display: flex; flex-wrap: wrap; gap: 7px; max-height: 232px; overflow-y: auto; align-content: flex-start; padding: 2px 2px 4px; }
  .tunes .label { flex: 0 0 100%; margin-top: 4px; }
  .tunes .btn { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
  .tunes .btn small { font-size: 11px; font-weight: 600; opacity: 0.65; font-variant-numeric: tabular-nums; }
  .find { width: 100%; min-height: 36px; padding: 0 12px; border: 2px solid var(--umber); border-radius: 999px; background: #fffaf2; font: inherit; font-size: 14px; color: var(--umber); }
  .find::placeholder { color: var(--ink-2); opacity: 0.7; }
  .midipick { display: grid; gap: 4px; }
  .midipick select { width: 100%; min-height: 36px; padding: 0 10px; border: 2px solid var(--umber); border-radius: 8px; background: #fffaf2; font: inherit; font-size: 13px; font-weight: 600; color: var(--umber); margin-bottom: 4px; }
  .note { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.35; }
  body.drop::after { content: "Drop the MIDI file"; position: fixed; inset: 12px; z-index: 8; display: grid; place-items: center; border: 3px dashed var(--umber); border-radius: 12px; background: rgba(251, 230, 204, 0.9); font-family: var(--display); font-weight: 900; font-size: 26px; }
  .sheet .btn { min-height: 38px; }
  @media (max-width: 899px) {
    .sheet { top: auto; bottom: 74px; left: 8px; right: 8px; width: auto; max-width: 460px; max-height: 46%; padding: 12px; gap: 10px; }
    .tunes { max-height: 118px; }
    .pill { left: 8px; bottom: 8px; }
  }

  .play {
    position: fixed; left: var(--cx, 50%); top: var(--cy, 50%); translate: -50% -50%; z-index: 2;
    min-height: 64px; padding: 0 30px; font-size: 19px; gap: 12px;
    font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 118;
    box-shadow: 5px 5px 0 var(--umber); background: var(--persimmon); color: var(--umber);
  }
  .play:hover { background: #ff7a42; }
  .play:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--umber); }
  .play.again { left: var(--ax, 50%); top: var(--ay, 50%); min-height: 52px; font-size: 16px; padding: 0 24px; }

  .scrim { position: fixed; inset: 0; z-index: 5; background: rgba(36, 16, 6, 0.5); }
  .export { position: fixed; left: 50%; top: 50%; translate: -50% -50%; z-index: 6; width: min(372px, calc(100% - 24px)); display: grid; gap: 14px; }
  .export .stack { display: grid; gap: 12px; }
  .export .label { display: block; margin-bottom: 5px; }
  .export p { margin: 0; font-size: 14px; }
  .meter { height: 16px; border: 2px solid var(--umber); border-radius: 999px; overflow: hidden; background: var(--plaster-2); }
  .meter i { display: block; height: 100%; width: 0; background: var(--persimmon); border-right: 2px solid var(--umber); }
  #exPct { font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; }
  a.btn { text-decoration: none; color: var(--plaster); }

  .piano { position: fixed; left: var(--cx, 50%); bottom: 16px; translate: -50% 0; display: none; gap: 10px; justify-items: center; z-index: 3; }
  .piano.on { display: grid; }
  .keys { position: relative; display: flex; height: 132px; filter: drop-shadow(4px 4px 0 var(--umber)); }
  .key {
    position: relative; width: 46px; height: 100%; padding: 0 0 8px; border: 2px solid var(--umber); margin-left: -2px;
    background: #fffaf2; border-radius: 0 0 6px 6px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--ink-2); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .key.black {
    position: absolute; top: 0; width: 32px; height: 60%; z-index: 2; margin: 0; background: var(--umber); color: var(--plaster);
    border-radius: 0 0 5px 5px;
  }
  .key.down { background: var(--persimmon) !important; color: var(--umber); }
  .piano .bar { display: flex; gap: 8px; align-items: center; background: var(--plaster); border: 2px solid var(--umber); border-radius: 999px; padding: 6px 12px; }
  .piano .bar.plain { background: none; border: 0; padding: 0; }
  @media (max-width: 640px) {
    .key { width: 30px; }
    .key.black { width: 22px; }
    .keys { height: 116px; }
    .piano { bottom: auto; top: 14px; left: 50%; }
  }
  @media (prefers-reduced-motion: reduce) { .pill { transition: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="c" aria-label="Marbles bounce down a run of xylophone keys, playing a tune."></canvas>
<button class="btn play" id="play">▶ Drop the marble</button>

<div class="pill panel" id="pill">
  <button class="btn solid" id="toggle">Play</button>
  <div class="txt">
    <span class="label">Now playing</span>
    <div class="now" id="now">Ode to Joy</div>
  </div>
  <button class="btn" id="open" aria-expanded="false" aria-controls="sheet">Tunes</button>
</div>

<section class="sheet panel" id="sheet" aria-label="Controls" hidden>
  <input class="find" id="find" type="search" placeholder="Find a tune" aria-label="Find a tune" autocomplete="off">
  <div class="tunes" role="group" aria-label="Tune" id="songs"></div>
  <div class="grid2">
    <label class="label" for="speed">Speed</label>
    <input type="range" id="speed" min="0.5" max="1.6" step="0.05" value="1">
    <output id="speedOut">1×</output>
  </div>
  <div class="row">
    <button class="btn" id="bass" aria-pressed="true">Bass marble</button>
    <button class="btn" id="path" aria-pressed="true">Show path</button>
  </div>
  <div class="row">
    <button class="btn" id="write">Write your own</button>
    <button class="btn" id="midi">Open a MIDI file</button>
    <button class="btn" id="video">Make a video</button>
  </div>
  <input type="file" id="midiFile" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
  <div class="midipick" id="midiPick" hidden>
    <label class="label" for="midiMel">Melody track</label>
    <select id="midiMel"></select>
    <label class="label" for="midiBass">Bass track</label>
    <select id="midiBass"></select>
  </div>
  <p class="note" id="midiNote">MIDI files are read on this device. Nothing is uploaded.</p>
</section>

<div class="scrim" id="scrim" hidden></div>
<section class="export panel" id="export" role="dialog" aria-label="Make a video" hidden>
  <div>
    <span class="label">Make a video of</span>
    <div class="now" id="exName">Ode to Joy</div>
  </div>
  <div class="stack" id="exSetup">
    <div>
      <span class="label">Shape</span>
      <div class="seg" id="exShape"><button data-v="v" aria-pressed="true">9:16 vertical</button><button data-v="h" aria-pressed="false">16:9 wide</button></div>
    </div>
    <div>
      <span class="label">Frames per second</span>
      <div class="seg" id="exFps"><button data-v="60" aria-pressed="true">60</button><button data-v="30" aria-pressed="false">30</button></div>
    </div>
    <div class="row"><button class="btn" id="exTitle" aria-pressed="true">Title card</button></div>
    <div class="row">
      <button class="btn solid" id="exGo">Render video</button>
      <button class="btn" id="exClose">Close</button>
    </div>
  </div>
  <div class="stack" id="exBusy" hidden>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="exMeter"><i id="exBar"></i></div>
    <div class="row"><span id="exPct">Getting ready…</span><button class="btn" id="exCancel">Cancel</button></div>
  </div>
  <div class="stack" id="exDone" hidden>
    <p id="exInfo"></p>
    <div class="row">
      <a class="btn solid" id="exSave" download>Download</a>
      <button class="btn" id="exBack">Back</button>
    </div>
  </div>
  <p id="exErr" hidden></p>
</section>

<div class="piano" id="piano" aria-label="Piano: play a tune, then build a run from it">
  <div class="bar"><span class="label" id="pianoHint">Play a tune. Keys A–K work too.</span></div>
  <div class="keys" id="keys"></div>
  <div class="bar plain">
    <button class="btn solid" id="build" disabled>Build my run</button>
    <button class="btn" id="cancel">Cancel</button>
  </div>
</div>

<script>

  // ── Playback, on the audio clock ───────────────────────────────────────────

          segments.push({ type: "rail", t0: r3(h.t), t1: r3(h.t + rl.T1), track: tid, pts, ts, fromKey: kid });
          segments.push({ type: "fall", t0: r3(h.t + rl.T1), t1: r3(t1), p0: pt(rl.pr[0], rl.pr[1]), v0: pt(rl.vr[0], rl.vr[1]), fromKey: null });
        } else segments.push({ type: "fall", t0: r3(h.t), t1: r3(t1), p0: pt(h.x, h.y), v0: pt(h.vout[0], h.vout[1]), fromKey: kid });
      });
      marbles.push({ id, radius: v.R, glass: `rgb(${v.glass})`, swirl: [v.body, v.swirl], release: { t: r3(v.tRel), at: pt(v.chute.x, v.chute.y) },
        segments, rest: { t: r3(v.cup.t), at: pt(v.cup.x, v.cup.y) } });
      const w = v.R + 5;
      chutes.push({ marble: id, at: pt(v.chute.x, v.chute.y), innerHalfWidth: w, tubeTop: r3(v.chute.y - v.R - 44), tubeBottom: r3(v.chute.y + v.R + 4), funnelTop: r3(v.chute.y - v.R - 64), gateOpens: r3(v.tRel) });
      cups.push({ marble: id, at: pt(v.cup.x, v.cup.y), innerHalfWidth: v.cup.w, rim: r3(v.cup.y - v.R - 13), floor: r3(v.cup.y + v.R + 3), t: r3(v.cup.t) });
      sounds.push({ t: r3(v.cup.t), marble: id, sound: "felt", loudness: 0.7 });
    });
    hits.sort((a, b) => a.t - b.t);
    // The camera, stepped exactly as the page steps it.
    const lead = 0.7, cam = [], step = 1 / 60, Hw = fh / fv.z;
    let cy = 0;
    for (let i = 0, t = -lead; t <= r.end + 1e-6; i++, t = -lead + i * step) {
      const target = Math.max(0, r.yAt(clamp(t, 0, r.cupT)) - Hw * 0.6);
      cy += (target - cy) * (1 - Math.exp(-step * 5));
      if (i % 2 === 0) { const [roll, punch] = camFx(r, t); cam.push([r3(t), r3(fv.FW / 2), r3(cy + Hw / 2), r3(Hw / punch), Math.round(roll * 1e5) / 1e5]); }
    }
    [view, bassOn] = keep;
    return {
      format: "marble-run-score/1",
      units: { length: "px", time: "s", angle: "rad", velocity: "px/s", gravity: "px/s^2" },
      tune: { name: song.name, bpm: song.bpm, speed: sp, beat: r3(60 / (song.bpm * sp)) },
      duration: r3(r.end), firstNote: FALL, lastNoteEnds: r3(r.tLast),
      gravity: [0, G],
      field: { width: r3(fv.FW), top: r3(r.y0), bottom: r3(r.y1), bassLaneWidth: r3(r.LW), sink: r3(r.sink) },
      frame: { aspect: wide ? "16:9" : "9:16", width: fw, height: fh, pxPerUnit: r3(fv.z), fieldLeft: r3(fv.ox) },
      layoutFlaws: r.flaws,
      sections: r.sections.map((x) => ({ t: r3(x.t), title: x.title })),
      marbles, keys, hits, extraSounds: sounds, tracks,
      fixtures: { chutes, cups },
      camera: { projection: "orthographic", lead, columns: ["t", "centerX", "centerY", "viewHeight", "roll"], samples: cam },
    };
  }

  // ── Make a video ────────────────────────────────────────────────────────────
  // Nothing here runs in real time. Each frame is drawn for its exact timestamp and
  // handed to an encoder; the sound is rendered by the same synth on an offline
  // context. A slow machine takes longer, but the video comes out identical.
  const MP4_MUXER = "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.mjs";
  const WEBM_MUXER = "https://cdn.jsdelivr.net/npm/webm-muxer@5.1.3/build/webm-muxer.mjs";
  let cancelExport = false;
  const breathe = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });

  async function pickCodecs(w, h, fps, force) {
    if (typeof VideoEncoder === "undefined" || force === "recorder") return null;
    const bitrate = Math.round(w * h * fps * 0.13 / 1e6) * 1e6;       // 16 Mbps at 1080p60, 8 at 30
    const vids = [["avc", "avc1.64002A"], ["avc", "avc1.640033"], ["avc", "avc1.4D402A"], ["avc", "avc1.42E02A"],
      ["vp9", "vp09.00.41.08"], ["vp9", "vp09.00.50.08"], ["av1", "av01.0.09M.08"]];
    let video = null, audio = null;
    for (const [kind, codec] of vids) {
      if (force === "webm" && kind === "avc") continue;
      const cfg = { codec, width: w, height: h, bitrate, framerate: fps, latencyMode: "quality" };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) { video = { kind, cfg }; break; } } catch (e) {}
    }
    if (!video) return null;
    if (typeof AudioEncoder !== "undefined") for (const [kind, codec] of [["aac", "mp4a.40.2"], ["opus", "opus"]]) {
      if (kind === "aac" && video.kind !== "avc") continue;
      const cfg = { codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 };
      try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) { audio = { kind, cfg }; break; } } catch (e) {}
    }
    return { video, audio };
  }

  /** The tune's sound, start to finish, rendered faster than real time. */
  function renderAudio(r, lead, total) {
    const rate = 48000, off = new OfflineAudioContext(2, Math.ceil(total * rate), rate);
    const keep = [ac, master, send, noiseBuf];
    ac = off;
    const g = makeGraph(off);
    master = g.master; send = g.send; noiseBuf = g.noiseBuf;
    const bus = makeBus();
    for (const e of r.events) strike(e, lead + e.t, bus);
    [ac, master, send, noiseBuf] = keep;
    return off.startRendering();
  }

  function drawTitleCard(tv, name) {
    const a = 1 - clamp((tv - 1.3) / 0.35), u = Math.min(W, H) / 1080;
    if (a <= 0) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const fs = Math.min(92 * u, (W * 0.74) / Math.max(4, name.length * 0.74));
    ctx.font = `900 ${fs}px "Anybody", system-ui`;
    try { ctx.fontStretch = "expanded"; ctx.letterSpacing = "-0.02em"; } catch (e) {}
    const tw = ctx.measureText(name.toUpperCase()).width;
    const cw = Math.max(tw, 420 * u) + 110 * u, ch = fs + 150 * u, cx = W / 2, cy = H * 0.5 - (1 - a) * 40 * u;
    ctx.globalAlpha = a;
    ctx.fillStyle = INK; rr(cx - cw / 2 + 10 * u, cy - ch / 2 + 10 * u, cw, ch, 14 * u); ctx.fill();
    ctx.fillStyle = PLASTER; rr(cx - cw / 2, cy - ch / 2, cw, ch, 14 * u); ctx.fill();
    ctx.lineWidth = 4 * u; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = INK; ctx.fillText(name.toUpperCase(), cx, cy + fs * 0.5);
    try { ctx.fontStretch = "normal"; ctx.letterSpacing = "0.1em"; } catch (e) {}
    ctx.font = `700 ${Math.round(24 * u)}px "Anybody", system-ui`; ctx.fillStyle = BRICK;
    ctx.fillText("MARBLE RUN", cx, cy - fs * 0.5 - 14 * u);
    try { ctx.letterSpacing = "0px"; } catch (e) {}
    ctx.globalAlpha = 1;
  }
  function drawCredit(age) {
    const u = Math.min(W, H) / 1080;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = clamp((age - 0.5) / 0.5) * 0.85;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#5a3a26";
    try { ctx.letterSpacing = "0.08em"; } catch (e) {}
    ctx.font = `700 ${Math.round(25 * u)}px "Anybody", system-ui`;
    ctx.fillText("labs.rushilchopra.com", W / 2, H - 46 * u);
    try { ctx.letterSpacing = "0px"; } catch (e) {}
    ctx.globalAlpha = 1;
  }

  /**
   * Render the current tune to a video file.
   * opt: { w, h, fps, title, force } — returns { blob, ext, note }.
   */
  async function exportVideo(opt, onProgress = () => {}) {
    const { w, h, fps } = opt;
    try { await document.fonts.load('900 40px "Anybody"'); } catch (e) {}
    stop();
    const live = { ctx, W, H, dpr, view, run, camY, poster };
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    exporting = true; cancelExport = false; setUI();
    let venc = null, aenc = null;
    try {
      ctx = cv.getContext("2d", { alpha: false }); W = w; H = h; dpr = 1; view = frameView(w, h); vignette = null; poster = null; camY = 0;
      run = build(current, speed); run.born = -1e9;
      if (g3) { sizeGL(w, h, 1); setRunGL(run); g3.insL = g3.insB = 0; }
      await loadFor(run);
      const name = run.song.name, lead = opt.title ? 1.9 : 0.7, mainEnd = run.cupT + 0.9, outro = 3.2;
      const total = lead + mainEnd + outro, frames = Math.round(total * fps);
      const paint = (tv, dt, first) => {
        const t = tv - lead;
        if (t < mainEnd) {
          if (g3) {
            renderGL(t, 0, first ? 0 : dt);
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(g3.renderer.domElement, 0, 0, w, h);
            drawOverlay(t, false);
          } else {
            const target = camTarget(t);
            camY = first ? target : camY + (target - camY) * (1 - Math.exp(-dt * 5));
            drawWorld(t, 0);
          }
          if (opt.title) drawTitleCard(tv, name);
        } else { drawPoster(t - mainEnd); drawCredit(t - mainEnd); }
      };
      const preview = () => {
        const c = live.ctx, cw = live.W * live.dpr, chh = live.H * live.dpr, k = Math.min(cw / w, chh / h) * 0.94;
        c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = INK; c.fillRect(0, 0, cw, chh);
        c.drawImage(cv, (cw - w * k) / 2, (chh - h * k) / 2, w * k, h * k);
      };
      const codecs = await pickCodecs(w, h, fps, opt.force);
      if (!codecs) return await recordLive(cv, paint, total, lead, fps, onProgress, preview);

      const mp4 = codecs.video.kind === "avc";
      const mod = await import(mp4 ? MP4_MUXER : WEBM_MUXER);
      const target = new mod.ArrayBufferTarget();
      const muxer = new mod.Muxer({
        target,
        video: { codec: mp4 ? "avc" : codecs.video.kind === "vp9" ? "V_VP9" : "V_AV1", width: w, height: h, frameRate: fps },
        ...(codecs.audio ? { audio: { codec: mp4 ? codecs.audio.kind : "A_OPUS", numberOfChannels: 2, sampleRate: 48000 } } : {}),
        ...(mp4 ? { fastStart: "in-memory" } : {}),
        firstTimestampBehavior: "offset",
      });
      let failed = null;
      onProgress(0, "Rendering the sound…");
      if (codecs.audio) {
        const buf = await renderAudio(run, lead, total);
        aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => { failed = e; } });
        aenc.configure(codecs.audio.cfg);
        // An AAC encoder delays its output by a fixed number of samples that an MP4 without an
        // edit list can't declare, so start that far into the (silent) lead-in instead.
        const skip = codecs.audio.kind === "aac" ? (/Mac|iPhone|iPad/.test(navigator.userAgent) ? 2112 : 1024) : 0;
        const L = buf.getChannelData(0).subarray(skip), R = buf.getChannelData(1).subarray(skip), n = Math.min(L.length, Math.round(total * 48000) - skip), step = 4800;
        for (let i = 0; i < n; i += step) {
          const len = Math.min(step, n - i), data = new Float32Array(len * 2);
          data.set(L.subarray(i, i + len), 0); data.set(R.subarray(i, i + len), len);
          const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: len, numberOfChannels: 2, timestamp: Math.round((i / 48000) * 1e6), data });
          aenc.encode(ad); ad.close();
        }
        await aenc.flush(); aenc.close(); aenc = null;
      }
      venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { failed = e; } });
      venc.configure(codecs.video.cfg);
      const began = performance.now();
      for (let f = 0; f < frames; f++) {
        if (cancelExport) throw new Error("cancelled");
        if (failed) throw failed;
        paint(f / fps, 1 / fps, f === 0);
        const vf = new VideoFrame(cv, { timestamp: Math.round((f * 1e6) / fps), duration: Math.round(1e6 / fps) });
        venc.encode(vf, { keyFrame: f % (fps * 2) === 0 }); vf.close();
        while (venc.encodeQueueSize > 6) await breathe();   // never get far ahead of the encoder
        if (f % 5 === 0) {
          const done = (f + 1) / frames, left = ((performance.now() - began) / 1000) * (1 / done - 1);
          onProgress(done, f < fps ? "" : `about ${left < 90 ? Math.ceil(left) + " s" : Math.ceil(left / 60) + " min"} left`);
          preview();
          await breathe();
        }
      }
      await venc.flush(); venc.close(); venc = null;
      if (failed) throw failed;
      muxer.finalize();
      const blob = new Blob([target.buffer], { type: mp4 ? "video/mp4" : "video/webm" });
      const how = `${codecs.video.cfg.codec.split(".")[0] === "avc1" ? "H.264" : codecs.video.kind.toUpperCase()}${codecs.audio ? " + " + codecs.audio.kind.toUpperCase() : ", no sound"}`;
      return { blob, ext: mp4 ? "mp4" : "webm", note: `${w}×${h}, ${fps} fps, ${total.toFixed(1)} s, ${how}` };
    } finally {
      try { if (venc && venc.state !== "closed") venc.close(); if (aenc && aenc.state !== "closed") aenc.close(); } catch (e) {}
      ({ ctx, W, H, dpr, view, run, camY, poster } = live);
      vignette = null; poster = null; exporting = false;
      if (g3) { sizeGL(W, H, g3.ratio); setRunGL(run); }
      setUI();
    }
  }

  /** Last resort, for browsers without WebCodecs: play it once for real and record the canvas. */
  async function recordLive(cv, paint, total, lead, fps, onProgress, preview) {
    if (typeof MediaRecorder === "undefined" || !cv.captureStream) throw new Error("This browser can't encode video.");
    audio();
    const mime = ["video/mp4;codecs=avc1.64002A,mp4a.40.2", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
    if (!mime) throw new Error("This browser can't encode video.");
    const dest = ac.createMediaStreamDestination(); liveOut.connect(dest);
    const stream = cv.captureStream(fps);
    dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6, audioBitsPerSecond: 192000 });
    const parts = [];
    rec.ondataavailable = (e) => { if (e.data.size) parts.push(e.data); };
    const stopped = new Promise((r) => { rec.onstop = r; });
    const bus = makeBus(), t0 = ac.currentTime + 0.2;
    try {
      paint(0, 0, true); rec.start(500);
      for (const e of run.events) strike(e, t0 + lead + e.t, bus);
      let last = 0;
      for (;;) {
        await new Promise((r) => requestAnimationFrame(r));
        if (cancelExport) throw new Error("cancelled");
        const tv = ac.currentTime - t0;
        if (tv >= total) break;
        if (tv >= 0) { paint(tv, Math.min(0.05, tv - last), false); last = tv; preview(); }
        onProgress(clamp(tv / total), `recording live: ${Math.ceil(total - Math.max(0, tv))} s left`);
      }
    } finally {
      bus.gain.value = 0; setTimeout(() => bus.disconnect(), 300);
      if (rec.state !== "inactive") rec.stop();
      await stopped;
      liveOut.disconnect(dest); stream.getTracks().forEach((t) => t.stop());
    }
    return { blob: new Blob(parts, { type: mime.split(";")[0] }), ext: mime.startsWith("video/mp4") ? "mp4" : "webm", note: `${cv.width}×${cv.height}, recorded live` };
  }

  // The dialog.
  const ex = { shape: "v", fps: 60, title: true, url: null };
  function exShow(which) { for (const id of ["exSetup", "exBusy", "exDone"]) $(id).hidden = id !== which; }
  function exOpen() {
    stop(); if (pianoOn) closePiano();
    $("exName").textContent = current.name;
    $("exErr").hidden = true;
    exShow("exSetup");
    $("scrim").hidden = false; $("export").hidden = false;
    $("exGo").focus();
  }
  function exClose() {
    if (exporting) return;
    $("scrim").hidden = true; $("export").hidden = true;
    if (ex.url) { URL.revokeObjectURL(ex.url); ex.url = null; }
  }
  for (const [id, key] of [["exShape", "shape"], ["exFps", "fps"]]) $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    ex[key] = key === "fps" ? Number(b.dataset.v) : b.dataset.v;
    $(id).querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("exTitle").addEventListener("click", () => { ex.title = !ex.title; $("exTitle").setAttribute("aria-pressed", String(ex.title)); });
  $("exGo").addEventListener("click", async () => {
    exShow("exBusy"); $("exErr").hidden = true;
    $("exBar").style.width = "0%"; $("exPct").textContent = "Getting ready…";
    const [w, h] = ex.shape === "v" ? [1080, 1920] : [1920, 1080];
    try {
      const out = await exportVideo({ w, h, fps: ex.fps, title: ex.title }, (p, msg) => {
        const pc = Math.round(p * 100);
        $("exBar").style.width = pc + "%"; $("exMeter").setAttribute("aria-valuenow", pc);
        $("exPct").textContent = p ? `${pc}%${msg ? " · " + msg : ""}` : msg;
      });
      const slug = current.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      ex.url = URL.createObjectURL(out.blob);
      $("exSave").href = ex.url; $("exSave").download = `marble-run-${slug}.${out.ext}`;
      $("exSave").textContent = `Download ${out.ext.toUpperCase()}`;
      $("exInfo").textContent = `${out.note} · ${(out.blob.size / 1048576).toFixed(1)} MB`;
      exShow("exDone"); $("exSave").focus();
      track("video_exported", { tune: tuneId(), aspect: ex.shape === "v" ? "9:16" : "16:9", fps: ex.fps });
    } catch (err) {
      exShow("exSetup");
      if (String(err && err.message) !== "cancelled") track("export_failed", { reason: String((err && err.message) || err).slice(0, 120) });
      if (String(err && err.message) !== "cancelled") { $("exErr").textContent = `That didn't work: ${err && err.message ? err.message : err}`; $("exErr").hidden = false; }
    }
  });
  $("exCancel").addEventListener("click", () => { cancelExport = true; });
  $("exBack").addEventListener("click", () => { if (ex.url) { URL.revokeObjectURL(ex.url); ex.url = null; } exShow("exSetup"); });
  $("exClose").addEventListener("click", exClose);
  $("scrim").addEventListener("click", exClose);
  $("video").addEventListener("click", exOpen);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("export").hidden) exClose(); });

  // For screenshots and tinkering: marbleRun.freeze(12.5) holds the run at 12.5 s.
  window.marbleRun = {
    freeze(t) { frozen = t; if (t === null) stop(); else { mode = "idle"; $("play").hidden = true; } },
    song(i) { stop(); useSong(SONGS[i] || surprise(), i); },
    names: () => SONGS.map((x) => x.name),
    openMidi,
    get midi() { return midiState && { mel: midiState.pick.mel, bass: midiState.pick.bass, tracks: midiState.song.tracks.map((t, i) => ({ name: t.name, ch: t.ch + 1, n: t.notes.length, score: +midiState.pick.scores[i].toFixed(2) })) }; },
    done() { finish(); },
    get run() { return run; },
    get perf() { return perfNow(); },
    resetPerf() { stats.n = 0; stats.i = 0; },
    score,
    exportVideo,
    async note(kind, midi) {
      if (KINDS[kind].sample) await loadSample(KINDS[kind].sample);
      const off = new OfflineAudioContext(2, 48000 * 3, 48000), keep = [ac, master, send, noiseBuf];
      ac = off; const g = makeGraph(off); master = g.master; send = g.send; noiseBuf = g.noiseBuf;
      strike({ midi, vel: 0.85, pan: 0, kind }, 0.05, makeBus());
      [ac, master, send, noiseBuf] = keep;
      return off.startRendering();
    },
  };
})();
</script>
</body>
</html>
