<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand world</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --mustard: #f4c04e; --teal: #1f6b70; --night: #170a05; }
  body { overflow: hidden; background: var(--plaster); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 276px minmax(0, 1fr); }

  .stage {
    position: relative; margin: 16px 20px 20px 4px; min-height: 0; overflow: hidden;
    border: 2px solid var(--umber); border-radius: 6px; box-shadow: 4px 4px 0 var(--umber);
    background: var(--night); touch-action: none; cursor: crosshair;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(10, 3, 0, 0.45); }
  .hint {
    position: absolute; left: 50%; top: 14px; translate: -50% 0; z-index: 2; pointer-events: none;
    padding: 7px 14px; border: 2px solid var(--umber); border-radius: 999px; background: var(--plaster);
    font-weight: 700; font-size: 13.5px; white-space: nowrap; box-shadow: 3px 3px 0 var(--umber);
    transition: opacity 500ms var(--ease), translate 500ms var(--ease);
  }
  .hint.off { opacity: 0; translate: -50% -8px; }

  .side { display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 20px; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { flex: none; width: 46px; height: 46px; border: 2px solid var(--umber); border-radius: 6px; background: var(--plaster-2); }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 130; font-size: 25px; line-height: 0.95; letter-spacing: -0.02em; }
  .brand p { margin: 4px 0 0; font-size: 12.5px; line-height: 1.25; color: var(--ink-2); font-weight: 600; }

  .bar { display: none; }
  .palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .chip {
    position: relative; display: grid; grid-template-rows: 22px auto; padding: 0; overflow: hidden;
    border: 2px solid var(--umber); border-radius: 6px; background: var(--plaster); cursor: pointer;
    transition: transform 120ms var(--ease), box-shadow 120ms var(--ease), background-color 120ms var(--ease);
  }
  .chip canvas { width: 100%; height: 22px; display: block; image-rendering: pixelated; border-bottom: 2px solid var(--umber); background: var(--night); }
  .chip .nm { padding: 4px 2px 5px; font-size: 11.5px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .chip kbd {
    position: absolute; top: 3px; right: 3px; min-width: 15px; padding: 1px 3px; border-radius: 3px;
    background: var(--plaster); color: var(--umber); border: 1.5px solid var(--umber); font: 800 9px/1.1 var(--sans); text-align: center;
  }
  .chip:hover { background: var(--plaster-2); }
  .chip[aria-pressed="true"] { background: var(--umber); color: var(--plaster); box-shadow: 3px 3px 0 var(--persimmon); transform: translate(-1px, -1px); }

  .ctl { display: grid; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 46px 1fr 22px; align-items: center; column-gap: 10px; }
  .grid2 output { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .windrow { display: grid; grid-template-columns: 46px 1fr; align-items: center; column-gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1.3fr 1fr; }
  .seg button { min-height: 34px; padding: 0 6px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .btns .btn { min-height: 38px; padding: 0 10px; font-size: 13.5px; }
  .tip { margin: 0; padding: 10px 12px; border: 2px solid var(--umber); border-radius: 6px; background: var(--mustard); font-size: 13px; font-weight: 600; line-height: 1.3; cursor: pointer; text-align: left; }
  .tip b { display: block; font-family: var(--display); font-variation-settings: "wdth" 112; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 2px; }
  .keys { margin: 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; font-weight: 600; }
  .keys .kbd { font-size: 10px; padding: 0 4px; }

  body.cover .side, body.cover .hint { display: none; }
  body.cover .app { grid-template-columns: 1fr; }
  body.cover .stage { margin: 0; border: 0; border-radius: 0; box-shadow: none; }

  @media (max-height: 760px) and (min-width: 721px) {
    .side { gap: 10px; padding-top: 12px; }
    .keys { display: none; }
    .chip { grid-template-rows: 18px auto; }
    .chip canvas { height: 18px; }
  }
  @media (max-height: 620px) and (min-width: 721px) { .tip { display: none; } }

  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .stage { order: 1; margin: 0; border: 0; border-bottom: 2px solid var(--umber); border-radius: 0; box-shadow: none; }
    .side { order: 2; gap: 8px; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); overflow: visible; }
    .brand, .tip, .keys { display: none; }
    .bar { display: flex; gap: 6px; align-items: center; }
    .bar .btn { min-height: 38px; padding: 0 11px; font-size: 13px; }
    .bar .cur { flex: 1; min-width: 0; justify-content: flex-start; gap: 8px; padding-left: 6px; }
    .bar .cur i { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--umber); background-size: cover; image-rendering: pixelated; }
    .bar .cur span { overflow: hidden; text-overflow: ellipsis; }
    .bar .cur em { margin-left: auto; font-style: normal; font-size: 11px; opacity: 0.7; }
    .palette { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
    .chip { grid-template-rows: 17px auto; border-radius: 5px; }
    .chip canvas { height: 17px; }
    .chip .nm { font-size: 9.5px; padding: 4px 0 5px; letter-spacing: -0.02em; }
    .chip kbd { display: none; }
    .chip[aria-pressed="true"] { box-shadow: 2px 2px 0 var(--persimmon); }
    .ctl { grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
    .grid2 { grid-template-columns: auto 1fr 18px; column-gap: 6px; }
    .windrow { grid-template-columns: auto 1fr; column-gap: 6px; }
    .seg button { min-height: 32px; font-size: 12.5px; }
    .btns { display: none; }
    .side.closed .palette, .side.closed .ctl { display: none; }
    .hint { font-size: 12.5px; top: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Elements and controls">
    <header class="brand">
      <svg viewBox="0 0 46 46" aria-hidden="true">
        <circle cx="0" cy="46" r="44" fill="#1f6b70"/><circle cx="0" cy="46" r="35" fill="#f4c04e"/>
        <circle cx="0" cy="46" r="26" fill="#f2662a"/><circle cx="0" cy="46" r="17" fill="#b32317"/><circle cx="0" cy="46" r="8" fill="#241006"/>
      </svg>
      <div><h1>Sand world</h1><p>Draw with elements. See what they do to each other.</p></div>
    </header>

    <div class="bar">
      <button class="btn cur" id="cur" aria-expanded="true" aria-controls="palette"><i id="curSw"></i><span id="curNm">Sand</span><em id="curTg">Hide</em></button>
      <button class="btn" id="pause2" aria-pressed="false" aria-label="Pause">❚❚</button>
      <button class="btn" id="clear2">Clear</button>
      <button class="btn" id="scene2">Scene</button>
      <button class="btn" id="sound2" aria-pressed="true" aria-label="Sound">♪</button>
    </div>

    <div class="palette" id="palette" role="group" aria-label="Element"></div>

    <div class="ctl">
      <div class="grid2">
        <label class="label" for="size">Brush</label>
        <input type="range" id="size" min="1" max="14" step="1" value="4">
        <output id="sizeOut">4</output>
      </div>
      <div class="windrow">
        <span class="label" id="windLb">Wind</span>
        <div class="seg" role="group" aria-labelledby="windLb" id="wind">
          <button data-w="-1" aria-pressed="false" aria-label="Wind blows left">←</button>
          <button data-w="0" aria-pressed="true">Calm</button>
          <button data-w="1" aria-pressed="false" aria-label="Wind blows right">→</button>
        </div>
      </div>
      <div class="btns">
        <button class="btn" id="pause" aria-pressed="false">Pause</button>
        <button class="btn" id="clear">Clear</button>
        <button class="btn" id="scene">Next scene</button>
        <button class="btn" id="sound" aria-pressed="true">Sound on</button>
      </div>
    </div>

    <button class="tip" id="tip" aria-live="polite"><b>Try this</b><span id="tipTx"></span></button>
    <p class="keys"><span class="kbd">Space</span> pause · <span class="kbd">[</span> <span class="kbd">]</span> brush · <span class="kbd">←</span> <span class="kbd">→</span> wind · <span class="kbd">C</span> clear · <span class="kbd">N</span> scene · <span class="kbd">M</span> sound · right-click erases</p>
  </aside>

  <main class="stage" id="stage">
    <canvas id="c" aria-label="A falling-sand sandbox: a night scene with a waterfall, a volcano and a persimmon tree. Draw on it with the selected element."></canvas>
    <div class="hint" id="hint">Pick an element, then draw</div>
  </main>
</div>

<script src="../track.js" defer></script>
<script>
(() => {
  // Analytics (../track.js). Never lets a lab down: no tracker, no call.
  const track = (...a) => { try { if (window.labTrack) window.labTrack(...a); } catch {} };
  "use strict";
  const $ = (id) => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (Q.has("cover")) document.body.classList.add("cover");

  // ── Elements ───────────────────────────────────────────────────────────────
  const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, WOOD = 4, FIRE = 5, SMOKE = 6, STEAM = 7, LAVA = 8, ICE = 9,
    PLANT = 10, SEED = 11, OIL = 12, POWDER = 13, TNT = 14, ACID = 15, SALT = 16, GLASS = 17, EMBER = 18, ASH = 19,
    ROCKET = 20, FLOWER = 21, SPROUT = 22, BORDER = 23, NT = 24;
  const ERASE = 100, BOLT = 101;

  // 0 nothing, 1 powder, 2 liquid, 3 gas, 4 solid
  const KIND = new Uint8Array(NT), DENS = new Uint8Array(NT), FLAM = new Uint8Array(NT), ACTIVE = new Uint8Array(NT), SPREAD = new Uint8Array(NT);
  [SAND, SEED, POWDER, SALT, ASH, ROCKET].forEach((t) => (KIND[t] = 1));
  [WATER, OIL, ACID, LAVA].forEach((t) => (KIND[t] = 2));
  [FIRE, SMOKE, STEAM].forEach((t) => (KIND[t] = 3));
  [STONE, WOOD, ICE, PLANT, TNT, GLASS, EMBER, FLOWER, SPROUT, BORDER].forEach((t) => (KIND[t] = 4));
  DENS[OIL] = 1; DENS[WATER] = 2; DENS[ACID] = 3; DENS[LAVA] = 4;
  SPREAD[WATER] = 5; SPREAD[OIL] = 3; SPREAD[ACID] = 4; SPREAD[LAVA] = 2;
  FLAM[WOOD] = 16; FLAM[PLANT] = 76; FLAM[FLOWER] = 76; FLAM[SPROUT] = 76; FLAM[SEED] = 80; FLAM[OIL] = 110;
  FLAM[POWDER] = 255; FLAM[TNT] = 255; FLAM[ROCKET] = 220;
  [SAND, WATER, FIRE, SMOKE, STEAM, LAVA, PLANT, SEED, OIL, POWDER, TNT, ACID, SALT, EMBER, ASH, ROCKET, SPROUT].forEach((t) => (ACTIVE[t] = 1));

  const TOOLS = [
    { id: SAND, name: "Sand", key: "1", fill: 40 }, { id: WATER, name: "Water", key: "2", fill: 60 },
    { id: STONE, name: "Stone", key: "3" }, { id: WOOD, name: "Wood", key: "4" },
    { id: SEED, name: "Seed", key: "5", fill: 5 }, { id: PLANT, name: "Plant", key: "6" },
    { id: ICE, name: "Ice", key: "7" }, { id: SALT, name: "Salt", key: "8", fill: 35 },
    { id: OIL, name: "Oil", key: "9", fill: 60 }, { id: FIRE, name: "Fire", key: "0", fill: 45 },
    { id: LAVA, name: "Lava", key: "L", fill: 50 }, { id: ACID, name: "Acid", key: "A", fill: 50 },
    { id: POWDER, name: "Gunpowder", key: "G", fill: 40 }, { id: TNT, name: "TNT", key: "T" },
    { id: ROCKET, name: "Firework", key: "F", fill: 30 }, { id: BOLT, name: "Bolt", key: "B" },
    { id: STEAM, name: "Steam", key: "V", fill: 40 }, { id: ERASE, name: "Eraser", key: "E" },
  ];
  const TIPS = [
    "Seeds need water. Sprinkle a few on sand, then rain on them.",
    "Pour lava into water. You get stone, and a lot of steam.",
    "Strike sand with a bolt of lightning and it turns to glass.",
    "Oil floats on water. It also burns there.",
    "Light a heap of fireworks, then stand well back.",
    "Salt melts ice, and salty water never freezes again.",
    "Stack TNT in a wall. One spark takes the lot.",
    "Acid eats nearly everything. Glass holds it.",
    "Plants drink their way through any water they touch.",
    "Steam cools back into rain. Boil a lake and wait.",
    "Turn the wind on while something is burning.",
  ];

  // ── Random ────────────────────────────────────────────────────────────────
  let seed = (parseInt(Q.get("seed"), 10) || (Date.now() ^ 0x9e3779b9)) | 0 || 1;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
  const rf = () => rnd() / 4294967296;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // ── World ─────────────────────────────────────────────────────────────────
  let VW = 0, VH = 0, GW = 0, GH = 0, type = null, data, shade, stamp, bg;
  let tick = 0, clock = 0, wind = 0, quiet = false;
  let NB4 = [], NB8 = [], NBE = [];
  let img, pix, gimg, gpix, wcan, wctx, gcan, gctx, g2, g2c, g4, g4c, g8, g8c;
  let emitters = [], bolts = [], blasts = [];
  let shake = 0, flash = 0, steamEv = 0, nFire = 0, nLava = 0;

  const canvas = $("c"), ctx = canvas.getContext("2d"), stage = $("stage");
  let cssW = 0, cssH = 0, cw = 0, ch = 0, dpr = 1;

  function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }

  function alloc(w, h) {
    VW = w; VH = h; GW = w + 2; GH = h + 2;
    const n = GW * GH;
    type = new Uint8Array(n); data = new Uint8Array(n); shade = new Uint8Array(n); stamp = new Uint8Array(n);
    for (let x = 0; x < GW; x++) { type[x] = BORDER; type[(GH - 1) * GW + x] = BORDER; }
    for (let y = 0; y < GH; y++) { type[y * GW] = BORDER; type[y * GW + GW - 1] = BORDER; }
    NB4 = [-GW, 1, GW, -1];
    NB8 = [-GW, 1, GW, -1, -GW - 1, -GW + 1, GW - 1, GW + 1];
    NBE = [-GW, -GW, -GW, -1, -1, 1, 1, GW];
    wcan = mk(VW, VH); wctx = wcan.getContext("2d"); img = wctx.createImageData(VW, VH); pix = new Uint32Array(img.data.buffer);
    gcan = mk(VW, VH); gctx = gcan.getContext("2d"); gimg = gctx.createImageData(VW, VH); gpix = new Uint32Array(gimg.data.buffer);
    g2c = mk(VW >> 1, VH >> 1); g2 = g2c.getContext("2d");
    g4c = mk(VW >> 2, VH >> 2); g4 = g4c.getContext("2d");
    g8c = mk(VW >> 3, VH >> 3); g8 = g8c.getContext("2d");
    makeSky();
    emitters = [];
  }

  // Night sky: umber gradient, a few stars, and a supergraphic moon of concentric rings.
  function makeSky() {
    bg = new Uint32Array(VW * VH);
    const mx = VW * 0.7, my = VH * 0.17, mr = Math.min(VW, VH) * 0.075;
    for (let y = 0; y < VH; y++) {
      const v = y / VH;
      for (let x = 0; x < VW; x++) {
        let r = 19 + v * 30, g = 9 + v * 13, b = 8 + v * 3;
        const d = Math.hypot(x - mx, y - my) / mr;
        if (d < 1) { r = 150; g = 84; b = 40; }
        else if (d < 1.38) { /* gap */ }
        else if (d < 1.8) { r += 40; g += 11; b += 2; }
        else if (d < 2.18) { /* gap */ }
        else if (d < 2.5) { r += 18; g += 5; b += 1; }
        const h = Math.imul(x * 7919 + y * 104729, 0x9e3779b1) >>> 0;
        const dn = ((h >>> 8) & 7) - 3;
        r += dn * 0.5; g += dn * 0.3;
        if (d > 2.6 && v < 0.62 && h % 331 === 0) { const s = 60 + ((h >>> 12) % 120); r = s + 30; g = s + 8; b = s - 20; }
        bg[y * VW + x] = pack(r, g, b);
      }
    }
  }

  function make(i, t) {
    type[i] = t; stamp[i] = clock;
    let s = rnd() & 255, d = 0;
    switch (t) {
      case FIRE: d = 24 + (rnd() % 30); break;
      case SMOKE: d = 60 + (rnd() % 60); break;
      case STEAM: d = 50 + (rnd() % 90); break;
      case EMBER: d = 130 + (rnd() % 120); break;
      case WOOD: s = (((Math.imul(i % GW, 0x9e3779b1) >>> 28) & 3) << 6) | (s & 63); break;
      case TNT: { const x = i % GW, y = (i / GW) | 0; const m = y % 6; s = ((x % 7 === 0 || m === 0 ? 3 : m === 3 || m === 4 ? 2 : s & 1) << 6) | (s & 63); break; }
      case STONE: s = 90 + (s % 166); break;
      case WATER: case OIL: case ACID: case LAVA: d = s & 128; break;
    }
    shade[i] = s; data[i] = d;
  }
  function move(i, j) { type[j] = type[i]; data[j] = data[i]; shade[j] = shade[i]; stamp[j] = clock; type[i] = 0; }
  function swap(i, j) {
    const t = type[j], d = data[j], s = shade[j];
    type[j] = type[i]; data[j] = data[i]; shade[j] = shade[i];
    type[i] = t; data[i] = d; shade[i] = s; stamp[j] = clock; stamp[i] = clock;
  }

  // ── Movement ──────────────────────────────────────────────────────────────
  function powder(i) {
    const b = i + GW, tb = type[b];
    if (tb === 0) {
      if (wind && (rnd() & 15) < 4) { const s = i + wind; if (type[s] === 0) { move(i, s); return true; } }
      if (type[b + GW] === 0 && (rnd() & 1)) move(i, b + GW); else move(i, b);
      return true;
    }
    const kb = KIND[tb];
    if (kb === 3 || (kb === 2 && (rnd() & 3) !== 0)) { swap(i, b); return true; }
    const d = rnd() & 1 ? 1 : -1;
    for (let k = 0; k < 2; k++) {
      const c = b + (k ? -d : d), tc = type[c];
      if (tc === 0) { move(i, c); return true; }
      const kc = KIND[tc];
      if (kc === 3 || (kc === 2 && (rnd() & 1))) { swap(i, c); return true; }
    }
    return false;
  }
  function liquid(i, t) {
    const b = i + GW, tb = type[b];
    if (tb === 0) { if (type[b + GW] === 0 && (rnd() & 1)) move(i, b + GW); else move(i, b); return true; }
    const kb = KIND[tb];
    if (kb === 3 || (kb === 2 && DENS[tb] < DENS[t] && (rnd() & 1))) { swap(i, b); return true; }
    let d = data[i] & 128 ? 1 : -1;
    for (let k = 0; k < 2; k++) {
      const c = b + (k ? -d : d), tc = type[c];
      if (tc === 0) { move(i, c); return true; }
      if (KIND[tc] === 2 && DENS[tc] < DENS[t] && (rnd() & 3) === 0) { swap(i, c); return true; }
    }
    const sp = SPREAD[t];
    for (let k = 0; k < 2; k++) {
      let j = i;
      for (let n = 0; n < sp; n++) {
        const c = j + d, tc = type[c];
        if (tc === 0 || KIND[tc] === 3) { j = c; if (type[c + GW] === 0) break; } else break;
      }
      if (j !== i) { if (type[j] === 0) move(i, j); else swap(i, j); return true; }
      d = -d; data[i] ^= 128;
    }
    return false;
  }
  function gas(i) {
    const r = rnd();
    let dx = r & 3; dx = dx === 0 ? -1 : dx === 1 ? 1 : 0;
    if (wind && ((r >> 4) & 3) !== 0) dx = wind;
    const u = i - GW + dx, tu = type[u];
    if (tu === 0) { move(i, u); return; }
    if (KIND[tu] === 2 && ((r >> 8) & 1)) { swap(i, u); return; }
    const s = i + (wind && ((r >> 12) & 3) ? wind : (r >> 10) & 1 ? 1 : -1);
    if (type[s] === 0) move(i, s);
  }

  // ── Reactions ─────────────────────────────────────────────────────────────
  function ignite(n, tn) {
    switch (tn) {
      case WOOD: type[n] = EMBER; data[n] = 130 + (rnd() % 120); break;
      case PLANT: case FLOWER: case SEED: case SPROUT: type[n] = EMBER; data[n] = 10 + (rnd() % 14); break;
      case OIL: type[n] = FIRE; data[n] = 30 + (rnd() % 40); break;
      case POWDER: type[n] = FIRE; data[n] = 12; explode(n % GW, (n / GW) | 0, 3, 0.55); break;
      case TNT: if (!data[n]) data[n] = 2 + (rnd() % 5); break;
      case ROCKET: launch(n); break;
    }
    stamp[n] = clock;
  }
  function blossom(i, s) {
    type[i] = FLOWER; data[i] = 1; shade[i] = s;
    const big = rnd() & 1;
    for (let k = 0; k < (big ? 8 : 4); k++) {
      const n = i + NB8[k], tn = type[n];
      if (tn === 0 || tn === WATER || KIND[tn] === 3) { type[n] = FLOWER; data[n] = 0; shade[n] = (s & 192) | (rnd() & 63); }
    }
  }

  function update(i, t) {
    switch (t) {
      case SAND: case POWDER: powder(i); break;
      case ROCKET: {
        const d = data[i];
        if (d === 1) { launch(i); break; }

    line(cx - (L >> 1), base, cx + 1, base - Hh + 2, 2, WOOD); line(cx + (L >> 1), base, cx - 1, base - Hh + 2, 2, WOOD);
    line(cx - L, base, cx + L, base, 3, WOOD); line(cx - L + 3, base - 3, cx + L - 3, base - 3, 2, WOOD);
    line(cx - L - 2, base - 1, cx - 3, base - Hh - 3, 2, WOOD); line(cx + L + 2, base - 1, cx + 3, base - Hh - 3, 2, WOOD);
    for (let y = base - 7; y <= base; y++) for (let x = cx - L; x <= cx + L; x++) if (inb(x, y)) { const i = idx(x, y); if (type[i] === WOOD && rf() < 0.5) { type[i] = EMBER; data[i] = 150 + (rnd() % 100); } else if (type[i] === 0 && rf() < 0.4) make(i, FIRE); }
    const fr = W < 170 ? [0.26, 0.74, 0.1, 0.9] : [0.36, 0.64, 0.22, 0.78, 0.09];
    const cups = fr.map((f) => (W * f) | 0);
    const cup = (mx, big) => {
      const u = Math.max(3, Math.round(W * 0.014)), my = surf[mx], hw = big ? u + 2 : u, hh = big ? u + 5 : u + 2;
      for (let x = mx - hw - 1; x <= mx + hw + 1; x++) for (let y = my - 1; y <= my + 3; y++) put(x, y, STONE, true);
      for (let y = my - hh - 2; y <= my - 1; y++) { put(mx - hw - 1, y, STONE, true); put(mx + hw + 1, y, STONE, true); }
      for (let x = mx - hw; x <= mx + hw; x++) for (let y = my - hh - 1; y <= my - 2; y++) put(x, y, ROCKET, true);
      return [my, hw, hh];
    };
    const fuse = (x0, x1) => { const s = x1 > x0 ? 1 : -1; for (let x = x0; x !== x1 + s; x += s) { put(x, surf[x] - 1, PLANT); put(x, surf[x] - 2, PLANT); } };
    const climb = (mx, my, hw, hh, s) => { // s: which side of the cup the fuse climbs (-1 left, 1 right)
      const wx = mx + s * (hw + 2);
      for (let y = my - hh - 3; y <= my; y++) { put(wx, y, PLANT); put(wx + s, y, PLANT); }
      put(mx + s * (hw + 1), my - hh - 4, PLANT); put(mx + s * hw, my - hh - 4, PLANT);
      put(mx + s * (hw + 1), my - hh - 3, PLANT); put(mx + s * hw, my - hh - 3, PLANT); put(mx + s * hw, my - hh - 2, PLANT); put(mx + s * (hw - 1), my - hh - 2, PLANT);
    };
    [1, -1].forEach((s) => {
      let from = cx + s * (L + 3);
      const side = cups.filter((m) => (m - cx) * s > 0).sort((a, b) => (a - b) * s);
      side.forEach((mx, k) => {
        const [my, hw, hh] = cup(mx, k === side.length - 1 && s < 0);
        fuse(from, mx - s * (hw + 2)); climb(mx, my, hw, hh, -s); climb(mx, my, hw, hh, s);
        from = mx + s * (hw + 2);
      });
      if (s > 0) { // the crate at the end of the right-hand fuse
        const kx = Math.min(W - 9, (W * 0.92) | 0), ky = surf[kx] - 1;
        fuse(from, kx - 5);
        for (let x = kx - 4; x <= kx + 4; x++) for (let y = ky - 7; y <= ky; y++) put(x, y, Math.abs(x - kx) === 4 || y === ky - 7 ? WOOD : y > ky - 3 ? POWDER : TNT, true);
        put(kx - 4, ky, PLANT, true); put(kx - 4, ky - 1, PLANT, true);
      }
    });
    return 30;
  }

  const SCENES = [{ name: "Island", fn: sceneIsland }, { name: "Bonfire night", fn: sceneBonfire }];
  let sceneI = clamp((parseInt(Q.get("scene"), 10) || 1) - 1, 0, SCENES.length - 1);
  function loadScene(n) {
    sceneI = ((n % SCENES.length) + SCENES.length) % SCENES.length;
    alloc(VW, VH); pn = 0; bolts = []; blasts = [];
    quiet = true;
    const pre = SCENES[sceneI].fn();
    for (let k = 0; k < pre; k++) step();
    quiet = false; shake = 0; flash = 0; blasts = [];
  }
  function clearAll() { alloc(VW, VH); pn = 0; bolts = []; blasts = []; }
  function regrid(nw, nh) {
    const ot = type, od = data, os = shade, ow = GW, oh = GH, ovw = VW, ovh = VH, em = emitters;
    alloc(nw, nh);
    const w = Math.min(ovw, nw), h = Math.min(ovh, nh);
    for (let y = 0; y < h; y++) {
      const a = (oh - 2 - y) * ow + 1, b = (GH - 2 - y) * GW + 1;
      for (let x = 0; x < w; x++) { type[b + x] = ot[a + x]; data[b + x] = od[a + x]; shade[b + x] = os[a + x]; }
    }
    const dy = nh - ovh;
    for (let p = 0; p < pn; p++) py_[p] += dy;
    emitters = em.filter((e) => { e.y += dy; return e.y > 0 && e.y < GH - 1 && (e.drain ? e.x1 < GW : e.x + e.w < GW); });
  }

  // ── Demo: a scripted hand, for ?demo=1 ────────────────────────────────────
  let demo = null;
  const DEMO = [
    [10, 90, SEED, 0.8, 0.5, 0.97, 0.5, 2], [80, 260, WATER, 0.8, 0.45, 0.97, 0.45, 2],
    [20, 130, OIL, 0.2, 0.62, 0.32, 0.62, 2], [200, 204, FIRE, 0.26, 0.76, 0.27, 0.78, 2],
    [150, 230, ROCKET, 0.7, 0.3, 0.72, 0.3, 1], [330, 336, FIRE, 0.69, 0.6, 0.73, 0.7, 3],
    [240, 300, SAND, 0.42, 0.2, 0.45, 0.2, 3], [300, 330, TNT, 0.47, 0.5, 0.53, 0.5, 2], [400, 400, BOLT, 0.5, 0.3, 0.5, 0.3, 1],
    [420, 520, ICE, 0.14, 0.6, 0.2, 0.6, 2], [540, 600, SALT, 0.15, 0.5, 0.2, 0.5, 2],
    [460, 560, ACID, 0.68, 0.3, 0.7, 0.3, 1], [600, 700, POWDER, 0.86, 0.45, 0.94, 0.45, 2], [760, 764, FIRE, 0.9, 0.6, 0.9, 0.7, 2],
  ];
  const DEMO2 = [
    [0, 1, STONE, 0.17, 0.6, 0.3, 0.6, 1], [0, 1, STONE, 0.36, 0.4, 0.45, 0.4, 1],
    [4, 44, ROCKET, 0.19, 0.56, 0.28, 0.56, 1], [4, 44, ROCKET, 0.38, 0.36, 0.43, 0.36, 1], [4, 44, ROCKET, 0.795, 0.7, 0.815, 0.7, 1],
    [80, 82, FIRE, 0.2, 0.585, 0.2, 0.585, 1], [112, 114, FIRE, 0.43, 0.385, 0.43, 0.385, 1], [146, 152, FIRE, 0.8, 0.79, 0.81, 0.82, 2],
    [188, 188, BOLT, 0.9, 0.3, 0.9, 0.3, 1],
  ];
  function runDemo() {
    const t = tick - demo.t0;
    for (const [a, b, tl, x0, y0, x1, y1, r] of demo.script) {
      if (t < a || t > b) continue;
      const u = (t - a) / Math.max(1, b - a), x = ((x0 + (x1 - x0) * u) * VW) | 0, y = ((y0 + (y1 - y0) * u) * VH) | 0;
      if (tl === BOLT) strike(x + 1); else if (b - a < 2 && tl === STONE) paintLine((x0 * VW) | 0, (y0 * VH) | 0, (x1 * VW) | 0, (y1 * VH) | 0, r, tl); else paintAt(x + 1, y + 1, r, tl);
    }
  }

  // ── Sound: everything is synthesised ──────────────────────────────────────
  const Snd = (() => {
    let ac = null, master, noise, fireG, sizzG, on = true, lastBoom = 0, lastPop = 0, lastWh = 0;
    try { on = localStorage.getItem("sand-world-sound") !== "off"; } catch {}
    function init() {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; return; }
      const sr = ac.sampleRate;
      master = ac.createGain(); master.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
      noise = ac.createBuffer(1, sr * 2, sr);
      const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const cb = ac.createBuffer(1, sr * 4, sr), cd = cb.getChannelData(0);
      let b = 0;
      for (let i = 0; i < cd.length; i++) { b = (b + 0.03 * (Math.random() * 2 - 1)) / 1.03; cd[i] = b * 2.2; }
      for (let n = 0; n < 150; n++) { const at = (Math.random() * (cd.length - 600)) | 0, a = 0.15 + Math.random() * 0.6, len = 40 + Math.random() * 260; for (let k = 0; k < 500; k++) cd[at + k] += (Math.random() * 2 - 1) * a * Math.exp(-k / len); }
      const loop = (buf, g) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(g); s.start(); };
      fireG = ac.createGain(); fireG.gain.value = 0; fireG.connect(master); loop(cb, fireG);
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3800;
      sizzG = ac.createGain(); sizzG.gain.value = 0; hp.connect(sizzG); sizzG.connect(master); loop(noise, hp);
    }
    function burstN(type, f0, f1, peak, dur, when) {
      const t = ac.currentTime + (when || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
    }
    function tone(type, f0, f1, peak, dur) {
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    const ok = () => ac && on && !quiet && ac.state === "running";
    return {
      get on() { return on; },
      wake() { if (!on) return; if (!ac) init(); if (ac && ac.state !== "running") ac.resume(); },
      set(v) { on = v; try { localStorage.setItem("sand-world-sound", v ? "on" : "off"); } catch {} if (v) this.wake(); else if (ac) ac.suspend(); },
      hush(h) { if (!ac || !on) return; if (h) ac.suspend(); else ac.resume(); },
      boom(size) {
        if (!ok() || ac.currentTime - lastBoom < 0.045) return; lastBoom = ac.currentTime;
        const k = clamp(size / 9, 0.25, 1.2);
        burstN("lowpass", 1400 * k + 300, 70, 0.75 * k, 0.35 + 0.5 * k); tone("sine", 120, 36, 0.7 * k, 0.3 + 0.35 * k);
      },
      pop() {
        if (!ok() || ac.currentTime - lastPop < 0.03) return; lastPop = ac.currentTime;
        burstN("bandpass", 1500 + Math.random() * 900, 500, 0.32, 0.28); tone("sine", 150, 60, 0.25, 0.18);
        for (let k = 0; k < 7; k++) burstN("highpass", 5000, 3000, 0.05 + Math.random() * 0.06, 0.03, 0.15 + Math.random() * 0.6);
      },
      whistle() { if (!ok() || ac.currentTime - lastWh < 0.07) return; lastWh = ac.currentTime; tone("triangle", 500 + Math.random() * 300, 1500 + Math.random() * 700, 0.035, 0.4); },
      thunder() { if (!ok()) return; burstN("highpass", 3000, 1200, 0.3, 0.09); burstN("lowpass", 900, 50, 0.8, 1.5); tone("sine", 90, 30, 0.5, 0.9); },
      beds(fire, sizz) { if (!ok()) return; const t = ac.currentTime; fireG.gain.setTargetAtTime(fire, t, 0.25); sizzG.gain.setTargetAtTime(sizz, t, 0.12); },
    };
  })();

  // ── UI ────────────────────────────────────────────────────────────────────
  const chips = new Map();
  function swatch(cv, id) {
    const c = cv.getContext("2d"), w = cv.width, h = cv.height, im = c.createImageData(w, h), p = new Uint32Array(im.data.buffer);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const s = rnd() & 255; let col;
      if (id === ERASE) col = (x + y) % 4 === 0 ? pack(251, 230, 204) : pack(40, 18, 9);
      else if (id === BOLT) { const zx = [9, 8, 7, 9, 8, 7, 6][y % 7]; col = x === zx || x === zx + 1 ? pack(255, 236, 170) : pack(36 + y * 3, 17 + y, 10); }
      else if (id === FIRE) col = LUT[FIRE][clamp(255 - y * 30 - (s & 63), 30, 255)];
      else if (id === STEAM) col = pack(120 + (s & 63), 128 + (s & 63), 138 + (s & 63));
      else if (id === TNT) { const m = y % 6; col = LUT[TNT][((x % 7 === 0 || m === 0 ? 3 : m === 3 || m === 4 ? 2 : 0) << 6) | (s & 63)]; }
      else if (id === WOOD) col = LUT[WOOD][(((Math.imul(x, 0x9e3779b1) >>> 28) & 3) << 6) | (s & 63)];
      else if (id === STONE) col = LUT[STONE][90 + (s % 166)];
      else if (id === SEED) col = s < 60 ? LUT[SEED][s] : pack(60, 30, 14);
      else col = LUT[id][s];
      p[y * w + x] = col;
    }
    c.putImageData(im, 0, 0);
  }
  const pal = $("palette");
  TOOLS.forEach((t) => {
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", "false"); b.title = `${t.name} (${t.key})`;
    const cv = document.createElement("canvas"); cv.width = 16; cv.height = 6; swatch(cv, t.id);
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = t.name;
    const kb = document.createElement("kbd"); kb.textContent = t.key; kb.setAttribute("aria-hidden", "true");
    b.append(cv, nm, kb); b.addEventListener("click", () => setTool(t.id));
    pal.append(b); chips.set(t.id, { b, cv, t });
  });
  function setTool(id) {
    tool = id;
    chips.forEach((c, k) => c.b.setAttribute("aria-pressed", String(k === id)));
    const c = chips.get(id);
    $("curNm").textContent = c.t.name; $("curSw").style.backgroundImage = `url(${c.cv.toDataURL()})`;
    if (live) track("element", { name: c.t.name }, { every: 4000 });
  }
  let sizeV = 4;
  function setSize(v) { sizeV = clamp(v | 0, 1, 14); brushR = sizeV - 1; $("size").value = sizeV; $("sizeOut").textContent = sizeV; }
  $("size").addEventListener("input", (e) => setSize(+e.target.value));
  function setWind(w) { wind = clamp(w, -1, 1); if (live) track("wind", { dir: wind < 0 ? "left" : wind > 0 ? "right" : "off" }, { every: 3000 }); $("wind").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.w === wind))); }
  $("wind").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setWind(+b.dataset.w); });
  let paused = false;
  function setPaused(p) { paused = p; $("pause").setAttribute("aria-pressed", String(p)); $("pause").textContent = p ? "Play" : "Pause"; $("pause2").setAttribute("aria-pressed", String(p)); $("pause2").textContent = p ? "▶" : "❚❚"; $("pause2").setAttribute("aria-label", p ? "Play" : "Pause"); }
  function setSound(v) { Snd.set(v); soundUI(v); track("sound", { on: !!v }, { every: 3000 }); }
  function soundUI(v) { $("sound").setAttribute("aria-pressed", String(v)); $("sound").textContent = v ? "Sound on" : "Sound off"; $("sound2").setAttribute("aria-pressed", String(v)); }
  let hintT = 0;
  function say(msg) { const h = $("hint"); h.textContent = msg; h.classList.remove("off"); clearTimeout(hintT); hintT = setTimeout(() => h.classList.add("off"), 1600); }
  function nextScene() { touched = true; demo = null; loadScene(sceneI + 1); say(SCENES[sceneI].name); track("scene", { name: SCENES[sceneI].name }, { every: 1500 }); }
  function doClear() { touched = true; demo = null; clearAll(); say("Cleared"); track("clear", {}, { every: 3000 }); }
  ["pause", "pause2"].forEach((id) => $(id).addEventListener("click", () => setPaused(!paused)));
  ["clear", "clear2"].forEach((id) => $(id).addEventListener("click", doClear));
  ["scene", "scene2"].forEach((id) => $(id).addEventListener("click", nextScene));
  ["sound", "sound2"].forEach((id) => $(id).addEventListener("click", () => setSound(!Snd.on)));
  $("cur").addEventListener("click", () => { const closed = $("side").classList.toggle("closed"); $("cur").setAttribute("aria-expanded", String(!closed)); $("curTg").textContent = closed ? "Show" : "Hide"; });
  let tipI = (rnd() % TIPS.length) | 0;
  function tip(n) { tipI = (n + TIPS.length) % TIPS.length; $("tipTx").textContent = TIPS[tipI]; }
  $("tip").addEventListener("click", () => tip(tipI + 1));
  tip(0); setInterval(() => { if (!document.hidden) tip(tipI + 1); }, 11000);

  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toUpperCase() : e.key, inRange = e.target && e.target.type === "range";
    const t = TOOLS.find((t) => t.key === k);
    if (t) { setTool(t.id); return; }
    if (k === " ") { if (e.target && e.target.tagName === "BUTTON") return; e.preventDefault(); setPaused(!paused); }
    else if (k === "[") setSize(sizeV - 1); else if (k === "]") setSize(sizeV + 1);
    else if (k === "ArrowLeft" && !inRange) setWind(wind > 0 ? 0 : -1);
    else if (k === "ArrowRight" && !inRange) setWind(wind < 0 ? 0 : 1);
    else if (k === "ArrowDown" && !inRange) setWind(0);
    else if (k === "C") doClear(); else if (k === "N") nextScene(); else if (k === "M") setSound(!Snd.on);
  });
  document.addEventListener("visibilitychange", () => Snd.hush(document.hidden));

  // ── Layout & loop ─────────────────────────────────────────────────────────
  const t0 = performance.now();
  function fit() {
    const r = stage.getBoundingClientRect(), w = stage.clientWidth, h = stage.clientHeight;
    if (w < 40 || h < 40) return;
    cssW = w; cssH = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (w * h * dpr * dpr > 3.2e6) dpr = Math.sqrt(3.2e6 / (w * h));
    cw = Math.round(w * dpr); ch = Math.round(h * dpr);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    const target = w < 720 ? 46000 : 92000;
    const c = clamp(Math.round(Math.sqrt((w * h) / target)), 2, 10);
    const nw = Math.max(48, Math.round(w / c)), nh = Math.max(48, Math.round(h / c));
    if (!type) {
      alloc(nw, nh); loadScene(sceneI);
      if (Q.has("demo")) demo = { t0: tick, script: Q.get("demo") === "2" ? DEMO2 : DEMO };
      if (Q.has("stress")) for (let y = 1; y < GH >> 1; y++) for (let x = 1; x < GW - 1; x++) if (type[y * GW + x] === 0) make(y * GW + x, [SAND, WATER, WATER, OIL, 0, 0][rnd() % 6] || SMOKE);
      if (Q.has("snd")) Snd.wake();
      const ff = parseInt(Q.get("ff"), 10) || 0;
      if (ff) { quiet = true; const a = performance.now(); for (let k = 0; k < ff; k++) step(); quiet = false; if (Q.has("debug")) console.log("sand-world step ms", ((performance.now() - a) / ff).toFixed(3), "grid", VW, VH); }
      if (Q.has("debug")) report();
      if (Q.has("freeze")) setPaused(true);
    } else if (nw !== VW || nh !== VH) {
      if (!touched && performance.now() - t0 < 2500 && !Q.has("ff")) { alloc(nw, nh); loadScene(sceneI); } else regrid(nw, nh);
    }
  }
  function report() {
    const n = new Array(NT).fill(0); for (let i = 0; i < type.length; i++) n[type[i]]++;
    const names = "empty sand water stone wood fire smoke steam lava ice plant seed oil powder tnt acid salt glass ember ash rocket flower sprout border".split(" ");
    console.log("sand-world counts t=" + tick + " " + names.map((s, i) => (n[i] ? s + ":" + n[i] : "")).filter(Boolean).join(" ") + " particles:" + pn);
  }
  new ResizeObserver(() => { fit(); if (type) draw(); }).observe(stage);

  let last = 0, acc = 0, sizz = 0, frames = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!type || document.hidden) { last = now; return; }
    const dt = Math.min(50, now - last); last = now;
    if (downs.size) holdPaint();
    if (!paused) {
      acc += dt;
      if (acc > 12) { step(); acc -= 16.667; if (acc > 16.667) { step(); acc -= 16.667; } if (acc > 20) acc = 0; if (acc < -17) acc = -17; }
    }
    draw();
    sizz = sizz * 0.9 + steamEv; steamEv = 0;
    if ((++frames & 3) === 0) Snd.beds(paused ? 0 : Math.min(0.5, nFire / 900 + nLava / 9000), paused ? 0 : Math.min(0.2, sizz * 0.012));
    if (Q.has("debug") && frames % 120 === 0) report();
  }
  setTool(SAND); setSize(innerWidth < 720 ? 3 : 4); setWind(0); soundUI(Snd.on);
  live = true; // from here on, picks are the visitor's
  fit();
  requestAnimationFrame(frame);
  window.__sand = { step, report, get tick() { return tick; } };
})();
